name: Guarded manual Bitcoin perpetual release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Read-only inventory or exact reviewed idle-only release
        required: true
        type: choice
        options: [inventory, apply]
        default: inventory
      candidate:
        description: Exact accepted candidate commit; required for apply
        required: false
        type: string
      fingerprint:
        description: Exact pinned installed fingerprint; required for apply
        required: false
        type: string

# Operations branch only. Never merge this dispatcher into product main.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guarded-release:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify operation contracts without production access
        run: python3 -B -m unittest discover -s kalshi_trade_infra/results/kalshi_perps_deployment_preparation_2026-10-23/release_operations -p 'test_*.py' -q

      - name: Configure the existing bounded AWS transport
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run guarded inventory or the exact accepted release
        env:
          TAU_PERPS_RELEASE_PHASE: ${{ inputs.phase }}
          TAU_PERPS_RELEASE_CANDIDATE: ${{ inputs.candidate }}
          TAU_PERPS_RELEASE_FINGERPRINT: ${{ inputs.fingerprint }}
        run: python3 -B kalshi_trade_infra/results/kalshi_perps_deployment_preparation_2026-10-23/release_operations/runner.py
