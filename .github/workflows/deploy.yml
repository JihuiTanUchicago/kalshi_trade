name: Read-only Bitcoin perps production readiness

on:
  workflow_dispatch:

# Separate from deploy-web: this cannot replace or cancel a pending release.
concurrency:
  group: kalshi-perps-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure the existing bounded AWS transport
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Inspect installed state and one anonymous 48-hour production window
        run: python3 -B kalshi_trade_infra/results/kalshi_bitcoin_perps_2026-10-23/operations/runner.py
