name: Guarded Meridian frontend release
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Inspect, correct the exact app-directory mode, or publish Meridian
        required: true
        type: choice
        options: [inventory, audit-source-modes, repair-app-mode, apply]
        default: inventory
      fingerprint:
        description: Exact fresh sanitized inventory fingerprint for apply
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact reviewed main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 kalshi_trade_infra/results/meridian_workspace_operations_2026-10-21/runner.py verify-main
      - name: Install pinned offline CSS parser
        if: inputs.phase == 'apply'
        run: python3 -m pip install --disable-pip-version-check tinycss2==1.4.0 webencodings==0.6.1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Inspect or publish the whole package without service restarts
        env:
          GH_TOKEN: ${{ github.token }}
          TAU_MERIDIAN_PHASE: ${{ inputs.phase }}
          TAU_MERIDIAN_FINGERPRINT: ${{ inputs.fingerprint }}
        run: python3 kalshi_trade_infra/results/meridian_workspace_operations_2026-10-21/runner.py "$TAU_MERIDIAN_PHASE"
