= False\n                output[\'rollback_requires_private_backup_review\'] = True\n        return output\n    finally:\n        sys.path[:] = original_path\n        sys.dont_write_bytecode = bytecode\n        sensitive = [value for value in credentials.values() if isinstance(value, str) and len(value) >= 8] if isinstance(credentials, dict) else []\n        if any(value in json.dumps(output) for value in sensitive):\n            restarted = output.get(\'restart_performed\', False)\n            output.clear()\n            output.update(mode=\'production_provider_activation\', status=\'receipt_withheld_redaction_failure\',\n                          restart_performed=restarted, private_inspection_required=True)\n'
