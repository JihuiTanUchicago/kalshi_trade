, env, output):\n    deadline, since = time.monotonic() + 60, None\n    while True:\n        current = jobs(interpreter, env)\n        output[\'database_jobs\'] = current\n        output[\'quiescence_samples\'] += 1\n        now, age = time.monotonic(), current[\'seconds_since_latest_finished\']\n        if not any(current[key] for key in (\'queued\', \'running\', \'paused\')) and (age is None or age > 30):\n            since = now if since is None else since\n            if now - since >= 30:\n                output[\'observed_quiet_seconds\'] = round(now - since, 2)\n                return True\n        else:\n            since = None\n        if now >= deadline:\n            return False\n        time.sleep(min(5, deadline - now))\n\n\ndef run_checks(credentials):\n    output = {\'mode\': \'production_provider_activation\', \'status\': \'preparing\', \'provider_calls\': 0,\n              \'model_calls\': 0, \'restart_performed\': False, \'daemon_reloaded\': False,\n              \'quiescence_samples\': 0, \'observed_quiet_seconds\': 0,\n              \'settings\': SETTINGS, \'databento_limit_scope\': \'per_context_not_monthly_or_account_wide\',\n              \'exa_application_quotas\': \'none\'}\n    installed, originals, dependencies = {}, {}, {}\n    backup, directory_created, restart_attempted = None, False, False\n    config_directories_created = []\n    original_path, bytecode = list(sys.path), sys.dont_write_bytecode\n    try:\n        if os.geteuid() != 0 or set(credentials) != set(KEYS):\n            raise ActivationError(\'invalid_activation_context\')\n        desired = {**SETTINGS, **credentials}\n        if any(not isinstance(value, str) or not 8 <= len(value) <= 4096 or \'$\' in value or \'`\' in value\n               or any(ord(char) < 32 or ord(char) == 127 for char in value) for value in credentials.values()):\n            raise ActivationError(\'invalid_literal_credentials\')\n        props, pid, interpreter, original_env = worker()\n        bas