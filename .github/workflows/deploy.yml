name: Guarded Funds frontend release
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Inspect or atomically publish the reviewed frontend-only release
        required: true
        type: choice
        options: [inventory, apply]
        default: inventory
      fingerprint:
        description: Exact fresh sanitized inventory fingerprint for apply
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact reviewed main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/JihuiTanUchicago/kalshi_trade/git/ref/heads/main --jq .object.sha)" = "2223751625dbdf3f07710ac27b58180fcadac23f"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Inspect or publish the whole package without service restarts
        env:
          TAU_FUNDS_PHASE: ${{ inputs.phase }}
          TAU_FUNDS_FINGERPRINT: ${{ inputs.fingerprint }}
        run: python3 kalshi_trade_infra/results/funds_broker_removal_operations_2026-10-20/runner.py "$TAU_FUNDS_PHASE"
