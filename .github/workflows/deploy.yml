name: Production provider acceptance (isolated checks)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-provider-acceptance
  cancel-in-progress: false

jobs:
  providers:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      TAU_PROBE_STATE: ${{ runner.temp }}/tau-provider-probe-state.json
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Verify real provider reads and scripted tool protocols on the production host
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          python3 - <<'PY'
          ENVELOPE_SOURCE = '"""Ephemeral RSA-OAEP credential transport; only ciphertext leaves the sender.\n\nThe receiver keeps its private key in a private directory under /run.  Credentials\nand decrypted chunks are passed to OpenSSL through pipes, never command arguments\nor plaintext files.  All public operations expose one fixed error message.\n"""\nfrom __future__ import annotations\n\nimport base64\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport stat\nimport subprocess\n\n\nFIELDS = (\n    "APCA_API_KEY_ID", "APCA_API_SECRET_KEY", "MASSIVE_API_KEY",\n    "DATABENTO_API_KEY", "EXA_API_KEY",\n)\nCHUNK_BYTES = 400\nMAX_FIELD_BYTES = 4096\nMAX_CHUNKS = (MAX_FIELD_BYTES + CHUNK_BYTES - 1) // CHUNK_BYTES\nMAX_ENVELOPE_BYTES = 65536\nKEY_FILE = "private_key.pem"\n_SESSION = re.compile(r"tau-provider-probe-[0-9a-f]{32}\\Z")\n_DIR_FLAGS = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC\n_FILE_FLAGS = os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC\n\n\nclass EnvelopeError(RuntimeError):\n    def __init__(self):\n        super().__init__("Credential envelope operation failed.")\n\n\ndef _session(value):\n    if not isinstance(value, str) or not _SESSION.fullmatch(value):\n        raise EnvelopeError()\n    return value\n\n\ndef _root_fd(root):\n    """Walk every directory with O_NOFOLLOW, without path-resolution races."""\n    path = Path(root)\n    if not path.is_absolute() or ".." in path.parts or len(str(path)) > 4096:\n        raise EnvelopeError()\n    fd = os.open("/", _DIR_FLAGS)\n    try:\n        for part in path.parts[1:]:\n            next_fd = os.open(part, _DIR_FLAGS, dir_fd=fd)\n            os.close(fd)\n            fd = next_fd\n        return fd\n    except BaseException:\n        os.close(fd)\n        raise\n\n\ndef _private_stat(fd, mode, directory=False):\n    info = os.fstat(fd)\n    kind = stat.S_ISDIR if directory else stat.S_ISREG\n    if not kind(info.st_mode) or info.st_uid != os.geteuid() or stat.S_IMODE(info.st_mode) != mode:\n        raise EnvelopeError()\n    if not directory and (info.st_nlink != 1 or not 1 <= info.st_size <= 16384):\n        raise EnvelopeError()\n\n\ndef _session_fd(root_fd, session):\n    fd = os.open(_session(session), _DIR_FLAGS, dir_fd=root_fd)\n    try:\n        _private_stat(fd, 0o700, directory=True)\n        return fd\n    except BaseException:\n        os.close(fd)\n        raise\n\n\ndef _run(args, data=None, *, pass_fds=(), output_fd=None, timeout=30):\n    result = subprocess.run(\n        ["openssl", *args], input=data,\n        stdout=subprocess.PIPE if output_fd is None else output_fd,\n        stderr=subprocess.PIPE, pass_fds=pass_fds, timeout=timeout,\n        check=False, close_fds=True,\n    )\n    if result.returncode or (result.stdout is not None and len(result.stdout) > 16384):\n        raise EnvelopeError()\n    return result.stdout\n\n\ndef _credentials(credentials):\n    if not isinstance(credentials, dict) or set(credentials) != set(FIELDS):\n        raise EnvelopeError()\n    encoded = {}\n    for field in FIELDS:\n        value = credentials[field]\n        if not isinstance(value, str) or not 1 <= len(value) <= MAX_FIELD_BYTES or not value.strip():\n            raise EnvelopeError()\n        raw = value.encode("utf-8")\n        if not 1 <= len(raw) <= MAX_FIELD_BYTES:\n            raise EnvelopeError()\n        encoded[field] = raw\n    return encoded\n\n\ndef _options(session, field, index, count):\n    label = "\\0".join(("tau-provider-envelope-v1", session, field, str(index), str(count))).encode("ascii")\n    return [\n        "-pkeyopt", "rsa_padding_mode:oaep",\n        "-pkeyopt", "rsa_oaep_md:sha256",\n        "-pkeyopt", "rsa_mgf1_md:sha256",\n        "-pkeyopt", "rsa_oaep_label:" + label.hex(),\n    ]\n\n\ndef create_session(root: Path = Path("/run")) -> dict:\n    root_fd = directory_fd = key_fd = None\n    session = None\n    created = False\n    try:\n        root_fd = _root_fd(root)\n        session = "tau-provider-probe-" + secrets.token_hex(16)\n        os.mkdir(session, 0o700, dir_fd=root_fd)\n        created = True\n        directory_fd = os.open(session, _DIR_FLAGS, dir_fd=root_fd)\n        os.fchmod(directory_fd, 0o700)\n        key_fd = os.open(KEY_FILE, os.O_RDWR | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC,\n                         0o600, dir_fd=directory_fd)\n        os.fchmod(key_fd, 0o600)\n        _run(["genpkey", "-algorithm", "RSA", "-pkeyopt", "rsa_keygen_bits:4096"],\n             output_fd=key_fd, timeout=60)\n        _private_stat(key_fd, 0o600)\n        os.lseek(key_fd, 0, os.SEEK_SET)\n        public = _run(["pkey", "-in", "/dev/fd/%d" % key_fd, "-pubout"], pass_fds=(key_fd,))\n        return {"session": session, "public_key_pem": public.decode("ascii")}\n    except Exception:\n        if directory_fd is not None:\n            try:\n                os.unlink(KEY_FILE, dir_fd=directory_fd)\n            except OSError:\n                pass\n        if root_fd is not None and created:\n            try:\n                os.rmdir(session, dir_fd=root_fd)\n            except OSError:\n                pass\n        raise EnvelopeError() from None\n    finally:\n        for fd in (key_fd, directory_fd, root_fd):\n            if fd is not None:\n                os.close(fd)\n\n\ndef encrypt_credentials(public_key_pem, session, credentials: dict) -> dict:\n    try:\n        _session(session)\n        encoded = _credentials(credentials)\n        if not isinstance(public_key_pem, str) or not 1 <= len(public_key_pem) <= 4096:\n            raise EnvelopeError()\n        public = public_key_pem.encode("ascii")\n        if not re.fullmatch(rb"-----BEGIN PUBLIC KEY-----\\n[A-Za-z0-9+/=\\n]+\\n-----END PUBLIC KEY-----\\n?", public):\n            raise EnvelopeError()\n        modulus = _run(["rsa", "-pubin", "-modulus", "-noout"], public)\n        if not re.fullmatch(rb"Modulus=[89A-Fa-f][0-9A-Fa-f]{1023}\\n", modulus):\n            raise EnvelopeError()\n        fields = {}\n        for field, raw in encoded.items():\n            chunks = [raw[i:i + CHUNK_BYTES] for i in range(0, len(raw), CHUNK_BYTES)]\n            fields[field] = []\n            for index, chunk in enumerate(chunks):\n                read_fd, write_fd = os.pipe()\n                try:\n                    os.write(write_fd, public)\n                    os.close(write_fd)\n                    write_fd = None\n                    ciphertext = _run(\n                        ["pkeyutl", "-encrypt", "-pubin", "-inkey", "/dev/fd/%d" % read_fd,\n                         *_options(session, field, index, len(chunks))], chunk, pass_fds=(read_fd,),\n                    )\n                    if len(ciphertext) != 512:\n                        raise EnvelopeError()\n                    fields[field].append(base64.b64encode(ciphertext).decode("ascii"))\n                finally:\n                    os.close(read_fd)\n                    if write_fd is not None:\n                        os.close(write_fd)\n        return {"version": 1, "session": session, "fields": fields}\n    except Exception:\n        raise EnvelopeError() from None\n\n\ndef decrypt_credentials(session, envelope, root: Path = Path("/run")) -> dict:\n    root_fd = directory_fd = key_fd = None\n    try:\n        _session(session)\n        if not isinstance(envelope, dict) or set(envelope) != {"version", "session", "fields"}:\n            raise EnvelopeError()\n        if type(envelope["version"]) is not int or envelope["version"] != 1 or envelope["session"] != session:\n            raise EnvelopeError()\n        fields = envelope["fields"]\n        if not isinstance(fields, dict) or set(fields) != set(FIELDS):\n            raise EnvelopeError()\n        # Validate bounds before serializing or invoking a subprocess.\n        for chunks in fields.values():\n            if not isinstance(chunks, list) or not 1 <= len(chunks) <= MAX_CHUNKS:\n                raise EnvelopeError()\n            if any(not isinstance(chunk, str) or len(chunk) != 684 for chunk in chunks):\n                raise EnvelopeError()\n        if len(json.dumps(envelope).encode("utf-8")) > MAX_ENVELOPE_BYTES:\n            raise EnvelopeError()\n        root_fd = _root_fd(root)\n        directory_fd = _session_fd(root_fd, session)\n        key_fd = os.open(KEY_FILE, _FILE_FLAGS, dir_fd=directory_fd)\n        _private_stat(key_fd, 0o600)\n        credentials = {}\n        for field in FIELDS:\n            plaintext = []\n            chunks = fields[field]\n            for index, chunk in enumerate(chunks):\n                ciphertext = base64.b64decode(chunk, validate=True)\n                if len(ciphertext) != 512 or base64.b64encode(ciphertext).decode("ascii") != chunk:\n                    raise EnvelopeError()\n                os.lseek(key_fd, 0, os.SEEK_SET)\n                raw = _run(\n                    ["pkeyutl", "-decrypt", "-inkey", "/dev/fd/%d" % key_fd,\n                     *_options(session, field, index, len(chunks))], ciphertext, pass_fds=(key_fd,),\n                )\n                if not 1 <= len(raw) <= CHUNK_BYTES:\n                    raise EnvelopeError()\n                plaintext.append(raw)\n            credentials[field] = b"".join(plaintext).decode("utf-8")\n        _credentials(credentials)\n        return credentials\n    except Exception:\n        raise EnvelopeError() from None\n    finally:\n        for fd in (key_fd, directory_fd, root_fd):\n            if fd is not None:\n                os.close(fd)\n\n\ndef destroy_session(session, root: Path = Path("/run")) -> None:\n    root_fd = directory_fd = key_fd = None\n    try:\n        _session(session)\n        root_fd = _root_fd(root)\n        try:\n            directory_fd = _session_fd(root_fd, session)\n        except FileNotFoundError:\n            return\n        if set(os.listdir(directory_fd)) - {KEY_FILE}:\n            raise EnvelopeError()\n        try:\n            key_fd = os.open(KEY_FILE, _FILE_FLAGS, dir_fd=directory_fd)\n        except FileNotFoundError:\n            pass\n        else:\n            _private_stat(key_fd, 0o600)\n            os.unlink(KEY_FILE, dir_fd=directory_fd)\n        os.rmdir(session, dir_fd=root_fd)\n    except Exception:\n        raise EnvelopeError() from None\n    finally:\n        for fd in (key_fd, directory_fd, root_fd):\n            if fd is not None:\n                os.close(fd)\n'
          PROBE_SOURCE = '"""Bounded real-provider/tool-protocol probes; never invoke the model or actions."""\nimport contextlib\nfrom datetime import datetime, timezone\nfrom decimal import Decimal\nimport io\nimport json\nimport logging\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport time\n\nROOT = Path(\'/opt/kalshi\')\nWINDOW_START = datetime(2026, 10, 16, 14, 0, tzinfo=timezone.utc)\nWINDOW_END = datetime(2026, 10, 16, 14, 10, tzinfo=timezone.utc)\n# These settings apply only to this isolated diagnostic process. The real worker\n# stays untouched; zero Databento spend is retained until the owner chooses a cap.\nTEST_SETTINGS = {\n    \'TAU_ALPACA_ENABLED\': \'1\', \'TAU_ALPACA_FEED\': \'iex\', \'TAU_ALPACA_SYMBOLS\': \'SPY\',\n    \'TAU_MASSIVE_ENABLED\': \'1\', \'TAU_MASSIVE_FX_FEED\': \'end_of_day\',\n    \'TAU_MASSIVE_FX_SYMBOLS\': \'EURUSD\',\n    \'TAU_MASSIVE_DATASETS\': \'fx,treasury_yields,funding_conditions,options\',\n    \'TAU_DATABENTO_ENABLED\': \'1\', \'TAU_DATABENTO_DATASETS\': \'EQUS.MINI,GLBX.MDP3\',\n    \'TAU_DATABENTO_DEFAULT_DATASET\': \'EQUS.MINI\', \'TAU_DATABENTO_MAX_COST_USD\': \'0\',\n    \'TAU_MARKET_DATA_PRIMARY\': \'databento\', \'TAU_EXA_ENABLED\': \'1\',\n    \'TAU_EXA_HISTORICAL_ENABLED\': \'1\', \'PYTHONDONTWRITEBYTECODE\': \'1\',\n}\n\n\ndef summarize(packet):\n    """Keep counts/provenance, never prices, article excerpts or raw API bodies."""\n    result = {k: packet[k] for k in (\n        \'provider\', \'kind\', \'status\', \'code\', \'feed\', \'dataset\', \'timeframe\',\n        \'retrieved_at\', \'start\', \'end_exclusive\', \'requested_start\',\n        \'requested_end_exclusive\', \'availability_clipped\', \'complete\',\n        \'estimated_cost_usd\', \'reserved_cost_usd\', \'budget_limit_usd\',\n        \'download_started\', \'cache_hit\', \'observation_count\', \'last_observation_date\',\n        \'snapshot_as_of\', \'temporal_basis\', \'reported_cost_usd\', \'request_id\',\n        \'excluded_after_cutoff\', \'historical_ranking\', \'qualified_backtest_features\',\n        \'scripted_model_calls\', \'real_model_calls\', \'knowledge_receipt_count\',\n        \'historical\', \'historical_current_data_blocked\', \'secret_in_model_context\',\n    ) if k in packet}\n    if isinstance(packet.get(\'sources\'), list):\n        sources = packet[\'sources\']\n        result.update(source_count=len(sources),\n                      source_hosts=sorted({s.get(\'publisher_host\') for s in sources if s.get(\'publisher_host\')}),\n                      sources_with_excerpts=sum(bool(s.get(\'excerpt\')) for s in sources),\n                      source_hashes=[s.get(\'content_sha256\') for s in sources[:3]])\n    if isinstance(packet.get(\'bars\'), dict):\n        result[\'bar_counts\'] = {s: len(rows) for s, rows in packet[\'bars\'].items()}\n        result[\'completed_intervals_only\'] = all(\n            row.get(\'interval_end\', \'\') <= packet.get(\'end_exclusive\', \'\')\n            for rows in packet[\'bars\'].values() for row in rows)\n    if isinstance(packet.get(\'symbols\'), dict):\n        result[\'symbols\'] = {s: {k: row[k] for k in (\'status\', \'count\', \'bar_count\',\n                             \'first_timestamp\', \'last_timestamp\', \'last_interval_end\', \'first_bar\', \'last_completed_at\') if k in row}\n                             for s, row in packet[\'symbols\'].items()}\n    if isinstance(packet.get(\'snapshots\'), dict):\n        result[\'snapshots\'] = {}\n        for symbol, snap in packet[\'snapshots\'].items():\n            item = {k: snap[k] for k in (\'status\', \'stale\', \'usable\', \'reason\') if k in snap}\n            for name in (\'latest_trade\', \'latest_quote\'):\n                if isinstance(snap.get(name), dict):\n                    item[name] = {k: snap[name][k] for k in (\'timestamp\', \'fresh\', \'stale\', \'age_seconds\', \'usable\') if k in snap[name]}\n            result[\'snapshots\'][symbol] = item\n        if packet.get(\'asset_class\') == \'us_option\':\n            contracts = list(packet[\'snapshots\'].values())\n            result.update(option_contract_count=len(contracts),\n                          contracts_with_iv=sum(c.get(\'implied_volatility\') is not None for c in contracts),\n                          contracts_with_greeks=sum(bool(c.get(\'greeks\')) for c in contracts))\n    if isinstance(packet.get(\'contracts\'), list):\n        result.update(contract_count=len(packet[\'contracts\']),\n                      contracts_with_iv=sum(c.get(\'implied_volatility\') is not None for c in packet[\'contracts\']),\n                      contracts_with_greeks=sum(bool(c.get(\'greeks\')) for c in packet[\'contracts\']))\n    if isinstance(packet.get(\'observations\'), list):\n        rows = packet[\'observations\']\n        result.update(observation_count=len(rows), last_observation_date=rows[-1].get(\'date\') if rows else None,\n                      observation_fields=sorted({k for row in rows for k in row if k != \'date\'}))\n    if isinstance(packet.get(\'latest_values\'), dict):\n        result[\'latest_field_dates\'] = {k: v.get(\'observation_date\') for k, v in packet[\'latest_values\'].items()}\n    return result\n\n\ndef actual_worker_environment():\n    pid = int(subprocess.check_output([\'systemctl\', \'show\', \'recursive-agents\', \'--property=MainPID\', \'--value\'], text=True).strip())\n    if pid <= 0:\n        raise RuntimeError(\'NoRunningWorker\')\n    proc = Path(\'/proc\') / str(pid)\n    env = dict(item.decode(\'utf-8\', \'replace\').split(\'=\', 1)\n               for item in (proc / \'environ\').read_bytes().split(b\'\\0\') if b\'=\' in item)\n    if (proc / \'cwd\').resolve() != ROOT:\n        raise RuntimeError(\'UnexpectedWorkerDirectory\')\n    return pid, env\n\n\ndef run_checks(credentials):\n    pid, original_env = actual_worker_environment()\n    os.environ.clear()\n    os.environ.update(original_env)\n    os.environ.update(credentials)\n    os.environ.update(TEST_SETTINGS)\n    os.chdir(ROOT)\n    sys.path.insert(0, str(ROOT))\n    logging.disable(logging.CRITICAL)\n    from app.alpaca_data import AlpacaDataClient, Config as AlpacaConfig\n    from app.massive_data import MassiveDataClient, Config as MassiveConfig\n    from app.databento_data import DatabentoDataClient, Config as DatabentoConfig, CostBudget\n    from app.agent_market_data import AgentMarketData, DataScope, _freshness\n    from app.agent_knowledge import AgentKnowledge\n    from app.llm import Usage\n    from app import agent_market_data as market_module\n\n    # Diagnostic pacing only; no product quota or service setting changes.\n    last_massive_request = [0.0]\n    def pace_massive():\n        remaining = 13 - (time.monotonic() - last_massive_request[0])\n        if remaining > 0:\n            time.sleep(remaining)\n        last_massive_request[0] = time.monotonic()\n    original_massive_client = MassiveDataClient\n    def paced_massive_client(config, **kwargs):\n        callback = kwargs.pop(\'checkpoint\', lambda: None)\n        def combined():\n            callback()\n            pace_massive()\n        return original_massive_client(config, checkpoint=combined, **kwargs)\n    market_module.MassiveDataClient = paced_massive_client\n\n    output = {\'mode\': \'isolated_provider_checks\', \'source_host\': \'production_web_box\',\n              \'worker_pid_for_environment\': pid, \'production_worker_modified\': False,\n              \'credentials_persisted\': False, \'model_backend\': \'scripted_no_llm\',\n              \'database_or_order_actions\': False, \'test_settings\': TEST_SETTINGS,\n              \'diagnostic_massive_request_spacing_seconds\': 13,\n              \'checked_at_utc\': datetime.now(timezone.utc).isoformat(), \'checks\': [], \'events\': []}\n    active_bridge = [None]\n    def error_result(exc):\n        return {\'status\': \'unavailable\', \'code\': getattr(exc, \'code\', type(exc).__name__),\n                \'error_class\': type(exc).__name__}\n    def check(name, operation):\n        started = time.monotonic()\n        try:\n            # Suppress library stdout/stderr; only the summary leaves this process.\n            with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):\n                packet = operation()\n            receipt = summarize(packet)\n            empty = ((\'bar_counts\' in receipt and not any(receipt[\'bar_counts\'].values()))\n                     or (\'observation_count\' in receipt and receipt[\'observation_count\'] == 0)\n                     or (\'source_count\' in receipt and receipt[\'source_count\'] == 0)\n                     or (\'option_contract_count\' in receipt and receipt[\'option_contract_count\'] == 0))\n            receipt.setdefault(\'status\', \'missing\' if empty else \'available\')\n        except Exception as exc:\n            packet, receipt = None, error_result(exc)\n        output[\'checks\'].append({\'name\': name, \'elapsed_seconds\': round(time.monotonic()-started, 3), **receipt})\n        return packet\n    def event(kind, message, packet=None):\n        if isinstance(packet, dict):\n            packet = packet.get(\'market_data\', packet)\n            if isinstance(packet, dict):\n                output[\'events\'].append({\'event_kind\': kind, \'bridge\': active_bridge[0], **summarize(packet)})\n\n    # Small fixed Friday windows avoid conflating closed-market freshness with auth.\n    with AlpacaDataClient(AlpacaConfig.from_env()) as client:\n        check(\'alpaca_current_snapshot\', lambda: _freshness({\'status\': \'available\', **client.snapshots([\'SPY\'])}, datetime.now(timezone.utc)))\n        check(\'alpaca_completed_history\', lambda: client.bars([\'SPY\'], WINDOW_START, WINDOW_END, timeframe=\'1Min\'))\n    with paced_massive_client(MassiveConfig.from_env()) as client:\n        check(\'massive_fx_history\', lambda: client.fx_bars([\'EURUSD\'], WINDOW_START, WINDOW_END, timeframe=\'1Min\'))\n        for dataset in (\'treasury_yields\', \'funding_conditions\'):\n            check(\'massive_\' + dataset, lambda dataset=dataset: client.macro(dataset,\n                  datetime(2026, 10, 1, tzinfo=timezone.utc), datetime(2026, 10, 17, tzinfo=timezone.utc)))\n        check(\'massive_options_chain\', lambda: client.options_chain({\'symbols\': [\'SPY\'],\n              \'expiration_date\': \'2026-10-23\', \'contract_type\': \'call\'}))\n    with paced_massive_client(MassiveConfig(credentials[\'MASSIVE_API_KEY\'], fx_feed=\'realtime\')) as client:\n        check(\'massive_current_fx_entitlement\', lambda: client.fx_quotes([\'EURUSD\']))\n    config = DatabentoConfig.from_env()\n    with DatabentoDataClient(config, budget=CostBudget(config.max_cost_usd)) as client:\n        for dataset, symbol in ((\'EQUS.MINI\', \'SPY\'), (\'GLBX.MDP3\', \'ESZ6\')):\n            check(\'databento_estimate_\' + dataset, lambda dataset=dataset, symbol=symbol:\n                  client.estimate([symbol], dataset, WINDOW_START, WINDOW_END, timeframe=\'1Min\'))\n            check(\'databento_bars_\' + dataset, lambda dataset=dataset, symbol=symbol:\n                  client.bars([symbol], dataset, WINDOW_START, WINDOW_END, timeframe=\'1Min\'))\n\n    def bridge(name, historical):\n        active_bridge[0] = name\n        scope = DataScope.research(int(WINDOW_START.timestamp()), int(WINDOW_END.timestamp())) if historical else DataScope()\n        usage, stage = Usage(), {\'index\': 0, \'calls\': 0, \'secret_leak\': False}\n        knowledge = AgentKnowledge(scope, event)\n        market = AgentMarketData(scope, event)\n        def model(system, messages):\n            stage[\'calls\'] += 1\n            text = system + json.dumps(messages)\n            stage[\'secret_leak\'] |= any(v and v in text for v in credentials.values())\n            index = stage[\'index\']\n            stage[\'index\'] += 1\n            if index == 0:\n                requests = [{\'kind\': \'publications\' if historical else \'search\',\n                             \'query\': \'prediction market probability calibration research\' if historical else \'Federal Reserve monetary policy October 2026\'}]\n                if not historical:\n                    requests.append({\'kind\': \'publications\', \'query\': \'prediction market probability calibration research\'})\n                obj = {\'knowledge_requests\': requests}\n            elif index == 1:\n                sources = [s for p in knowledge.receipts for s in p.get(\'sources\', [])]\n                if sources:\n                    obj = {\'knowledge_requests\': [{\'kind\': \'contents\', \'source_id\': sources[0][\'source_id\']}]}\n                else:\n                    # Provider denial must not prevent testing the market bridge.\n                    stage[\'index\'] = 3\n                    return model_market_request(2), {\'input_tokens\': 0, \'output_tokens\': 0}\n            elif index == 2:\n                return model_market_request(index), {\'input_tokens\': 0, \'output_tokens\': 0}\n            elif index == 3 and historical:\n                return model_market_request(index), {\'input_tokens\': 0, \'output_tokens\': 0}\n            else:\n                obj = {\'reply\': \'Provider smoke test complete.\', \'actions\': []}\n            return json.dumps(obj), {\'input_tokens\': 0, \'output_tokens\': 0}\n        def model_market_request(index):\n            if index == 3:\n                requests = [\n                    {\'provider\': \'databento\', \'kind\': \'bars\', \'dataset\': \'EQUS.MINI\', \'symbols\': [\'SPY\'], \'timeframe\': \'1Min\', \'lookback_days\': 1},\n                    {\'provider\': \'databento\', \'kind\': \'bars\', \'dataset\': \'GLBX.MDP3\', \'symbols\': [\'ESZ6\'], \'timeframe\': \'1Min\', \'lookback_days\': 1},\n                ]\n            elif historical:\n                requests = [\n                    {\'provider\': \'alpaca\', \'kind\'