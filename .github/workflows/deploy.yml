                  program += 'import json\nresult={}\n'
                  program += 'try:\n'
                  program += '    credentials=ns["decrypt_credentials"](' + repr(session) + ',' + repr(envelope) + ')\n'
                  program += '    result=probe["run_checks"](credentials)\n'
                  program += 'except Exception as exc:\n    result={"mode":"isolated_provider_checks","error_class":type(exc).__name__,"status":"probe_error"}\n'
                  program += 'finally:\n    ns["destroy_session"](' + repr(session) + ')\n'
                  program += 'result["ephemeral_private_key_removed"]=True\nprint(json.dumps(result,default=str))\n'
                  data = json.dumps({'version': 1, 'program': program}).encode()
                  if any(value and value.encode() in data for value in credentials.values()):
                      raise RuntimeError('Plaintext credential found in encrypted transport')
                  digest = hashlib.sha256(data).hexdigest()
                  key = 'bundle/provider-probe-' + uuid.uuid4().hex + '.json'
                  with tempfile.TemporaryDirectory(prefix='tau-provider-ciphertext-') as temp:
                      path = Path(temp) / 'encrypted-probe.json'
                      path.write_bytes(data)
                      response = subprocess.run(['aws', 's3', 'cp', str(path), 's3://' + BUCKET + '/' + key,
                                                 '--sse', 'AES256', '--region', REPO_REGION, '--only-show-errors'],
                                                capture_output=True, text=True, timeout=60)
                      if response.returncode:
                          raise RuntimeError('Encrypted probe upload failed')
                  bootstrap = 'import hashlib,json,subprocess\n'
                  bootstrap += 'data=subprocess.check_output(' + repr(['aws', 's3', 'cp', 's3://' + BUCKET + '/' + key, '-', '--region', REPO_REGION, '--only-show-errors']) + ')\n'
                  bootstrap += 'if hashlib.sha256(data).hexdigest()!=' + repr(digest) + ':\n    raise RuntimeError("EncryptedBundleIntegrityMismatch")\n'
                  bootstrap += 'exec(json.loads(data)["program"])\n'
                  result = remote(bootstrap, 'Tau isolated read-only provider smoke tests', timeout=600)
                  if result.get('mode') not in ('isolated_provider_checks', 'isolated_authorized_databento_followup', 'production_provider_activation'):
                      raise RuntimeError('Invalid provider probe result')
                  print('TAU_PROVIDER_RESULTS=' + json.dumps(result), flush=True)
                  if result.get('status') in ('probe_error', 'activation_failed_before_restart', 'activation_requires_inspection'):
                      raise RuntimeError('Provider configuration activation failed; inspect the redacted receipt')
                  if result.get('mode') == 'production_provider_activation' and result.get('status') == 'activated':
                      verification = 'v={};exec(' + repr(VERIFICATION_SOURCE) + ',v)\n'
                      verification += 'import json\ntry:\n    result=v["run_checks"]()\nexcept Exception as exc:\n    result={"mode":"production_provider_verification","status":"verification_error","error_class":type(exc).__name__}\nprint(json.dumps(result,default=str))\n'
                      verified = remote(verification, 'Tau verify providers using actual activated worker environment', timeout=600)
                      print('TAU_PROVIDER_VERIFICATION=' + json.dumps(verified), flush=True)
              finally:
                  final = cleanup(session)
                  print('TAU_PROVIDER_CLEANUP=' + json.dumps(final), flush=True)


          APP_FILES = (
              'app/agent_market_data.py', 'app/market_data_config.py', 'app/alpaca_data.py',
              'app/massive_data.py', 'app/databento_data.py', 'app/exa_data.py',
              'app/agent_knowledge.py', 'app/worker.py',
          )
          PROVIDER_FIELDS = ('APCA_API_KEY_ID', 'APCA_API_SECRET_KEY', 'MASSIVE_API_KEY', 'DATABENTO_API_KEY', 'EXA_API_KEY')
          MANAGED_SETTINGS = (
              'TAU_MARKET_DATA_PRIMARY', 'TAU_DATABENTO_ENABLED', 'TAU_DATABENTO_DATASETS',
              'TAU_DATABENTO_DEFAULT_DATASET', 'TAU_DATABENTO_MAX_COST_USD', 'TAU_ALPACA_ENABLED',
              'TAU_ALPACA_FEED', 'TAU_ALPACA_SYMBOLS', 'ALPACA_DATA_ENDPOINT', 'TAU_MASSIVE_ENABLED',
              'TAU_MASSIVE_FX_FEED', 'TAU_MASSIVE_FX_SYMBOLS', 'TAU_MASSIVE_DATASETS',
              'TAU_EXA_ENABLED', 'TAU_EXA_HISTORICAL_ENABLED',
          )
          RESEARCH_SETTINGS = {'TAU_EXA_ENABLED', 'TAU_EXA_HISTORICAL_ENABLED'}
          SERVICE_SETTING_NAMES = ('Restart', 'RestartUSec', 'TimeoutStartUSec', 'TimeoutStopUSec',
                                   'MemoryHigh', 'MemoryMax', 'MemorySwapMax', 'Nice', 'KillMode', 'KillSignal')


          def classify_inventory(snapshot, expected_settings=None, expected_app_hashes=None,
                                 expected_unit_hashes=None, expected_service_settings=None):
              """Pure guard: matching protected stage + unchanged code + idle DB are required."""
              desired = globals().get('EXPECTED_SETTINGS') if expected_settings is None else expected_settings
              hashes = globals().get('EXPECTED_APP_HASHES') if expected_app_hashes is None else expected_app_hashes
              units = globals().get('EXPECTED_UNIT_HASHES') if expected_unit_hashes is None else expected_unit_hashes
              resources = globals().get('EXPECTED_SERVICE_SETTINGS') if expected_service_settings is None else expected_service_settings
              result = {'mode': 'production_provider_wait', 'provider_calls': 0, 'model_calls': 0,
                        'receiver_created': False, 'credentials_delivered': False,
                        'files_written': False, 'restart_performed': False,
                        'authenticated_queued_model_canary': 'not_performed'}

              def halt(reason):
                  return {**result, 'status': 'halt_conflict', 'reason': reason,
                          'requires_operator_action': True}

              if (not isinstance(desired, dict) or set(desired) != set(MANAGED_SETTINGS)
                      or any(not isinstance(value, str) or not value or len(value) > 256 for value in desired.values())
                      or not isinstance(hashes, dict) or set(hashes) != set(APP_FILES)
                      or any(not isinstance(value, str) or not re.fullmatch(r'[0-9a-f]{64}', value) for value in hashes.values())
                      or not isinstance(units, dict) or 'fragment' not in units
                      or any(not isinstance(key, str) or not re.fullmatch(r'fragment|drop_in_\d+', key) for key in units)
                      or any(not isinstance(value, str) or not re.fullmatch(r'[0-9a-f]{64}', value) for value in units.values())
                      or not isinstance(resources, dict) or set(resources) != set(SERVICE_SETTING_NAMES)
                      or any(not isinstance(value, str) or not value or len(value) > 64 for value in resources.values())):
                  return halt('invalid_expected_guard_configuration')
              if (not isinstance(snapshot, dict) or snapshot.get('status') != 'inspected'
                      or snapshot.get('mode') != 'activation_inventory' or snapshot.get('service') != 'recursive-agents'
                      or type(snapshot.get('main_pid')) is not int or snapshot['main_pid'] <= 0
                      or type(snapshot.get('provider_calls')) is not int or snapshot['provider_calls'] != 0
                      or type(snapshot.get('model_calls')) is not int or snapshot['model_calls'] != 0
                      or snapshot.get('read_only') is not True or snapshot.get('cwd') != '/opt/kalshi'
                      or snapshot.get('worker_module_argv') is not True
                      or not isinstance(snapshot.get('interpreter'), str)
                      or not re.fullmatch(r'/opt/kalshi/\.venv(?:313)?/bin/python(?:3(?:\.\d{1,2})?)?', snapshot['interpreter'])):
                  return halt('worker_inventory_unavailable_or_unexpected')
              service = snapshot.get('service_settings')
              if (not isinstance(service, dict) or service.get('ActiveState') != 'active' or service.get('SubState') != 'running'
                      or any(service.get(key) != value for key, value in resources.items())):
                  return halt('agent_service_settings_changed_or_unavailable')
              files = snapshot.get('app_source_files')
              if not isinstance(files, dict):
                  return halt('app_source_inventory_unavailable')
              for name, expected in hashes.items():
                  info = files.get(name)
                  if (not isinstance(info, dict) or info.get('exists') is not True
                          or info.get('regular_file') is not True or info.get('symlink') is not False
                          or info.get('sha256') != expected):
                      return halt('app_source_changed_or_unavailable')
              drop, startup, installed = (snapshot.get('staged_provider_dropin'), snapshot.get('staged_startup'), snapshot.get('installed_unit_files'))
              if (not isinstance(drop, dict) or drop.get('exists') is not True or drop.get('regular_file') is not True
                      or drop.get('owner_is_root') is not True or drop.get('symlink') is not False or drop.get('mode') != '0600'
                      or not isinstance(drop.get('sha256'), str) or not re.fullmatch(r'[0-9a-f]{64}', drop['sha256'])
                      or not isinstance(startup, dict) or startup.get('status') != 'recognized'
                      or startup.get('fragment_launch_compatible') is not True or startup.get('provider_dropin_matches_expected') is not True
                      or not isinstance(installed, dict) or 'fragment' not in installed):
                  return halt('staged_startup_changed_or_unavailable')
              if snapshot.get('no_unrecognized_pending_dropins') is not True:
                  return halt('unrecognized_pending_unit_dropin')
              if (type(snapshot.get('drop_in_count')) is not int or snapshot['drop_in_count'] != len(installed) - 1
                      or any(not isinstance(key, str) or not re.fullmatch(r'fragment|drop_in_\d+', key) for key in installed)):
                  return halt('loaded_unit_inventory_contradictory')
              approved_loaded = 0
              for label, info in installed.items():
                  if (not isinstance(info, dict) or info.get('exists') is not True or info.get('regular_file') is not True
                          or info.get('owner_is_root') is not True or info.get('symlink') is not False):
                      return halt('installed_unit_changed_or_unsafe')
                  if label in units:
                      if info.get('sha256') != units[label]:
                          return halt('installed_unit_changed_or_unsafe')
                  elif info.get('sha256') == drop['sha256'] and label.startswith('drop_in_'):
                      approved_loaded += 1
                  else:
                      return halt('unrecognized_loaded_dropin')
              if approved_loaded > 1 or any(label not in installed for label in units):
                  return halt('loaded_unit_inventory_contradictory')
              structure = snapshot.get('exec_start')
              if (not isinstance(structure, dict) or any(structure.get(key) is not True for key in (
                      'recognized_base_shell_layout', 'module_app_worker_agents', 'interpreter_matches_mainpid',
                      'logging_redirected', 'stderr_joined_to_stdout', 'unsets_aws_profile'))):
                  return halt('active_launcher_changed_or_unavailable')
              directory = snapshot.get('provider_directory')
              if (not isinstance(directory, dict) or directory.get('exists') is not True
                      or directory.get('directory') is not True or directory.get('symlink') is not False
                      or directory.get('owner_is_root') is not True or directory.get('mode') != '0700'
                      or directory.get('parent_chain_secure') is not True):
                  return halt('staged_provider_directory_changed_or_unsafe')
              overlays = snapshot.get('protected_overlays')
              if not isinstance(overlays, dict):
                  return halt('staged_provider_overlays_unavailable')
              for filename, fields in (('market-data.env', PROVIDER_FIELDS[:4]), ('research-data.env', PROVIDER_FIELDS[4:])):
                  info = overlays.get(filename)
                  if (not isinstance(info, dict) or info.get('exists') is not True
                          or info.get('regular_file') is not True or info.get('symlink') is not False
                          or info.get('owner_is_root') is not True or info.get('mode') != '0600'
                          or info.get('literal_parse_valid') is not True):
                      return halt('staged_provider_overlay_changed_or_unsafe')
                  presence, settings = info.get('credential_presence'), info.get('settings')
                  if not isinstance(presence, dict) or any(presence.get(field) is not True for field in fields):
                      return halt('staged_provider_credentials_missing')
                  if not isinstance(settings, dict):
                      return halt('staged_provider_settings_unavailable')
                  expected = {key: value for key, value in desired.items()
                              if (key in RESEARCH_SETTINGS) == (filename == 'research-data.env')}
                  if any(settings.get(key) != value for key, value in expected.items()):
                      return halt('staged_provider_settings_changed')
              actual, presence = snapshot.get('settings'), snapshot.get('credential_presence')
              if not isinstance(actual, dict) or not isinstance(presence, dict):
                  return halt('actual_worker_provider_inventory_unavailable')
              if any(key not in actual for key in desired):
                  return halt('actual_worker_managed_settings_provenance_missing')
              if any(actual.get(key) is not None and actual[key] != value for key, value in desired.items()):
                  return halt('actual_worker_managed_settings_conflict')
              if any(type(presence.get(field)) is not bool for field in PROVIDER_FIELDS):
                  return halt('actual_worker_credential_presence_unavailable')
              jobs = snapshot.get('database_jobs')
              if (not isinstance(jobs, dict) or jobs.get('status') != 'available'
                      or jobs.get('transaction') != 'read_only'
                      or any(type(jobs.get(key)) is not int or jobs[key] < 0 for key in ('queued', 'running', 'paused'))):
                  return halt('read_only_job_inventory_unavailable')
              counts = {key: jobs[key] for key in ('queued', 'running', 'paused')}
              result['database_jobs'] = counts
              fully_active = all(presence[field] for field in PROVIDER_FIELDS) and all(actual.get(key) == value for key, value in desired.items())
              baseline_absent = not any(presence[field] for field in PROVIDER_FIELDS) and all(actual.get(key) is None for key in desired)
              if not fully_active and not baseline_absent:
                  return halt('partial_actual_provider_activation_conflict')
              if fully_active:
                  return {**result, 'status': 'already_active', 'reason': 'actual_worker_environment_matches_approved_settings',
                          'actual_worker_environment_verified': True,
                          'provider_verification': 'actual_environment_verification_required_once'}
              if any(counts.values()):
                  return {**result, 'status': 'waiting_for_idle', 'reason': 'research_or_agent_jobs_still_active'}
              return {**result, 'status': 'ready_for_activation', 'reason': 'staged_configuration_unchanged_and_jobs_idle'}


          def main():
              """Perform the read-only guard before creating a receiver or reading keys."""
              try:
                  program = 'ns={};exec(' + repr(WAIT_INVENTORY_SOURCE) + ',ns)\n'
                  program += 'import json\ntry:\n    result=ns["inventory"]()\nexcept Exception as exc:\n    result={"status":"inventory_error","error_class":type(exc).__name__,"read_only":True}\nprint(json.dumps(result,default=str))\n'
                  snapshot = remote(program, 'Tau read-only wait-for-idle provider activation inventory', timeout=90)
                  print('TAU_PROVIDER_INVENTORY=' + json.dumps(snapshot), flush=True)
                  decision = classify_inventory(snapshot)
                  print('TAU_PROVIDER_RESULTS=' + json.dumps(decision), flush=True)
              except Exception as exc:
                  result = {'mode': 'production_provider_wait', 'status': 'wait_guard_error',
                            'reason': 'sanitized_guard_or_activation_error', 'error_class': type(exc).__name__,
                            'provider_calls': 0, 'model_calls': 0,
                            'authenticated_queued_model_canary': 'not_performed'}
                  print('TAU_PROVIDER_RESULTS=' + json.dumps(result), flush=True)
                  return result
              if decision['status'] == 'ready_for_activation':
                  try:
                      activate_after_idle()
                  except Exception as exc:
                      result = {'mode': 'production_provider_activation', 'status': 'activation_dispatch_requires_inspection',
                                'reason': 'inspect_prior_redacted_activation_receipts', 'error_class': type(exc).__name__,
                                'authenticated_queued_model_canary': 'not_performed'}
                      print('TAU_PROVIDER_RESULTS=' + json.dumps(result), flush=True)
                      return result
              elif decision['status'] == 'already_active':
                  try:
                      verification = 'v={};exec(' + repr(VERIFICATION_SOURCE) + ',v)\n'
                      verification += 'import json\ntry:\n    result=v["run_checks"]()\nexcept Exception as exc:\n    result={"mode":"production_provider_verification","status":"verification_error","error_class":type(exc).__name__}\nprint(json.dumps(result,default=str))\n'
                      verified = remote(verification, 'Tau verify already-active providers using actual worker environment', timeout=600)
                      print('TAU_PROVIDER_VERIFICATION=' + json.dumps(verified), flush=True)
                      return {**decision, 'provider_verification': 'actual_environment_verification_dispatched_once'}
                  except Exception as exc:
                      result = {'mode': 'production_provider_wait', 'status': 'already_active_verification_requires_inspection',
                                'reason': 'actual_environment_verification_failed', 'error_class': type(exc).__name__,
                                'receiver_created': False, 'credentials_delivered': False,
                                'files_written': False, 'restart_performed': False,
                                'authenticated_queued_model_canary': 'not_performed'}
                      print('TAU_PROVIDER_RESULTS=' + json.dumps(result), flush=True)
                      return result
              return decision


          if __name__ == '__main__':
              if '--cleanup' in sys.argv:
                  if STATE.is_file():
                      try:
                          print('TAU_PROVIDER_CLEANUP=' + json.dumps(cleanup(json.loads(STATE.read_text())['session'])), flush=True)
                      except Exception as exc:
                          print('TAU_PROVIDER_CLEANUP=' + json.dumps({'status': 'cleanup_error', 'error_class': type(exc).__name__}), flush=True)
              else:
                  main()


          PY
