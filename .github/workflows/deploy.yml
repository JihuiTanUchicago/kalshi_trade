name: Current-main production rollout
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - name: Check out immutable reviewed operation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require the tested current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/JihuiTanUchicago/kalshi_trade/git/ref/heads/main --jq .object.sha)" = "1bf2b13e8d8b277dcc6ddf4bd0a71123c18ab65c"
      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Capture encrypted source for recovery review
        run: python3 kalshi_trade_infra/results/main_production_operations_2026-10-19/capture_source_runner.py
      - name: Save ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: tau-encrypted-source-review
          path: /tmp/tau-encrypted-source-review/
          retention-days: 3
          if-no-files-found: error
      - name: Remove any pending encrypted capture
        if: ${{ always() }}
        run: python3 kalshi_trade_infra/results/main_production_operations_2026-10-19/capture_source_runner.py --cleanup
