name: Production Databento acceptance (authorized fixed windows)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-provider-acceptance
  cancel-in-progress: false

jobs:
  providers:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      TAU_PROBE_STATE: /tmp/tau-provider-probe-state-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Verify authorized fixed-window Databento downloads and cache on the production host
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          python3 - <<'PY'
          ENVELOPE_SOURCE = '"""Ephemeral RSA-OAEP credential transport; only ciphertext leaves the sender.\n\nThe receiver keeps its private key in a private directory under /run.  Credentials\nand decrypted chunks are passed to OpenSSL through pipes, never command arguments\nor plaintext files.  All public operations expose one fixed error message.\n"""\nfrom __future__ import annotations\n\nimport base64\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport stat\nimport subprocess\n\n\nFIELDS = (\n    "APCA_API_KEY_ID", "APCA_API_SECRET_KEY", "MASSIVE_API_KEY",\n    "DATABENTO_API_KEY", "EXA_API_KEY",\n)\nCHUNK_BYTES = 400\nMAX_FIELD_BYTES = 4096\nMAX_CHUNKS = (MAX_FIELD_BYTES + CHUNK_BYTES - 1) // CHUNK_BYTES\nMAX_ENVELOPE_BYTES = 65536\nKEY_FILE = "private_key.pem"\n_SESSION = re.compile(r"tau-provider-probe-[0-9a-f]{32}\\Z")\n_DIR_FLAGS = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC\n_FILE_FLAGS = os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC\n\n\nclass EnvelopeError(RuntimeError):\n    def __init__(self):\n        super().__init__("Credential envelope operation failed.")\n\n\ndef _session(value):\n    if not isinstance(value, str) or not _SESSION.fullmatch(value):\n        raise EnvelopeError()\n    return value\n\n\ndef _root_fd(root):\n    """Walk every directory with O_NOFOLLOW, without path-resolution races."""\n    path = Path(root)\n    if not path.is_absolute() or ".." in path.parts or len(str(path)) > 4096:\n        raise EnvelopeError()\n    fd = os.open("/", _DIR_FLAGS)\n    try:\n        for part in path.parts[1:]:\n            next_fd = os.open(part, _DIR_FLAGS, dir_fd=fd)\n            os.close(fd)\n            fd = next_fd\n        return fd\n    except BaseException:\n        os.close(fd)\n        raise\n\n\ndef _private_stat(fd, mode, directory=False):\n    info = os.fstat(fd)\n    kind = stat.S_ISDIR if directory else stat.S_ISREG\n    if not kind(info.st_mode) or info.st_uid != os.geteuid() or stat.S_IMODE(info.st_mode) != mode:\n        raise EnvelopeError()\n    if not directory and (info.st_nlink != 1 or not 1 <= info.st_size <= 16384):\n        raise EnvelopeError()\n\n\ndef _session_fd(root_fd, session):\n    fd = os.open(_session(session), _DIR_FLAGS, dir_fd=root_fd)\n    try:\n        _private_stat(fd, 0o700, directory=True)\n        return fd\n    except BaseException:\n        os.close(fd)\n        raise\n\n\ndef _run(args, data=None, *, pass_fds=(), output_fd=None, timeout=30):\n    result = subprocess.run(\n        ["openssl", *args], input=data,\n        stdout=subprocess.PIPE if output_fd is None else output_fd,\n        stderr=subprocess.PIPE, pass_fds=pass_fds, timeout=timeout,\n        check=False, close_fds=True,\n    )\n    if result.returncode or (result.stdout is not None and len(result.stdout) > 16384):\n        raise EnvelopeError()\n    return result.stdout\n\n\ndef _credentials(credentials):\n    if not isinstance(credentials, dict) or set(credentials) != set(FIELDS):\n        raise EnvelopeError()\n    encoded = {}\n    for field in FIELDS:\n        value = credentials[field]\n        if not isinstance(value, str) or not 1 <= len(value) <= MAX_FIELD_BYTES or not value.strip():\n            raise EnvelopeError()\n        raw = value.encode("utf-8")\n        if not 1 <= len(raw) <= MAX_FIELD_BYTES:\n            raise EnvelopeError()\n        encoded[field] = raw\n    return encoded\n\n\ndef _options(session, field, index, count):\n    label = "\\0".join(("tau-provider-envelope-v1", session, field, str(index), str(count))).encode("ascii")\n    return [\n        "-pkeyopt", "rsa_padding_mode:oaep",\n        "-pkeyopt", "rsa_oaep_md:sha256",\n        "-pkeyopt", "rsa_mgf1_md:sha256",\n        "-pkeyopt", "rsa_oaep_label:" + label.hex(),\n    ]\n\n\ndef create_session(root: Path = Path("/run")) -> dict:\n    root_fd = directory_fd = key_fd = None\n    session = None\n    created = False\n    try:\n        root_fd = _root_fd(root)\n        session = "tau-provider-probe-" + secrets.token_hex(16)\n        os.mkdir(session, 0o700, dir_fd=root_fd)\n        created = True\n        directory_fd = os.open(session, _DIR_FLAGS, dir_fd=root_fd)\n        os.fchmod(directory_fd, 0o700)\n        key_fd = os.open(KEY_FILE, os.O_RDWR | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC,\n                         0o600, dir_fd=directory_fd)\n        os.fchmod(key_fd, 0o600)\n        _run(["genpkey", "-algorithm", "RSA", "-pkeyopt", "rsa_keygen_bits:4096"],\n             output_fd=key_fd, timeout=60)\n        _private_stat(key_fd, 0o600)\n        os.lseek(key_fd, 0, os.SEEK_SET)\n        public = _run(["pkey", "-in", "/dev/fd/%d" % key_fd, "-pubout"], pass_fds=(key_fd,))\n        return {"session": session, "public_key_pem": public.decode("ascii")}\n    except Exception:\n        if directory_fd is not None:\n            try:\n                os.unlink(KEY_FILE, dir_fd=directory_fd)\n            except OSError:\n                pass\n        if root_fd is not None and created:\n            try:\n                os.rmdir(session, dir_fd=root_fd)\n            except OSError:\n                pass\n        raise EnvelopeError() from None\n    finally:\n        for fd in (key_fd, directory_fd, root_fd):\n            if fd is not None:\n                os.close(fd)\n\n\ndef encrypt_credentials(public_key_pem, session, credentials: dict) -> dict:\n    try:\n        _session(session)\n        encoded = _credentials(credentials)\n        if not isinstance(public_key_pem, str) or not 1 <= len(public_key_pem) <= 4096:\n            raise EnvelopeError()\n        public = public_key_pem.encode("ascii")\n        if not re.fullmatch(rb"-----BEGIN PUBLIC KEY-----\\n[A-Za-z0-9+/=\\n]+\\n-----END PUBLIC KEY-----\\n?", public):\n            raise EnvelopeError()\n        modulus = _run(["rsa", "-pubin", "-modulus", "-noout"], public)\n        if not re.fullmatch(rb"Modulus=[89A-Fa-f][0-9A-Fa-f]{1023}\\n", modulus):\n            raise EnvelopeError()\n        fields = {}\n        for field, raw in encoded.items():\n            chunks = [raw[i:i + CHUNK_BYTES] for i in range(0, len(raw), CHUNK_BYTES)]\n            fields[field] = []\n            for index, chunk in enumerate(chunks):\n                read_fd, write_fd = os.pipe()\n                try:\n                    os.write(write_fd, public)\n                    os.close(write_fd)\n                    write_fd = None\n                    ciphertext = _run(\n                        ["pkeyutl", "-encrypt", "-pubin", "-inkey", "/dev/fd/%d" % read_fd,\n                         *_options(session, field, index, len(chunks))], chunk, pass_fds=(read_fd,),\n                    )\n                    if len(ciphertext) != 512:\n                        raise EnvelopeError()\n                    fields[field].append(base64.b64encode(ciphertext).decode("ascii"))\n                finally:\n                    os.close(read_fd)\n                    if write_fd is not None:\n                        os.close(write_fd)\n        return {"version": 1, "session": session, "fields": fields}\n    except Exception:\n        raise EnvelopeError() from None\n\n\ndef decrypt_credentials(session, envelope, root: Path = Path("/run")) -> dict:\n    root_fd = directory_fd = key_fd = None\n    try:\n        _session(session)\n        if not isinstance(envelope, dict) or set(envelope) != {"version", "session", "fields"}:\n            raise EnvelopeError()\n        if type(envelope["version"]) is not int or envelope["version"] != 1 or envelope["session"] != session:\n            raise EnvelopeError()\n        fields = envelope["fields"]\n        if not isinstance(fields, dict) or set(fields) != set(FIELDS):\n            raise EnvelopeError()\n        # Validate bounds before serializing or invoking a subprocess.\n        for chunks in fields.values():\n            if not isinstance(chunks, list) or not 1 <= len(chunks) <= MAX_CHUNKS:\n                raise EnvelopeError()\n            if any(not isinstance(chunk, str) or len(chunk) != 684 for chunk in chunks):\n                raise EnvelopeError()\n        if len(json.dumps(envelope).encode("utf-8")) > MAX_ENVELOPE_BYTES:\n            raise EnvelopeError()\n        root_fd = _root_fd(root)\n        directory_fd = _session_fd(root_fd, session)\n        key_fd = os.open(KEY_FILE, _FILE_FLAGS, dir_fd=directory_fd)\n        _private_stat(key_fd, 0o600)\n        credentials = {}\n        for field in FIELDS:\n            plaintext = []\n            chunks = fields[field]\n            for index, chunk in enumerate(chunks):\n                ciphertext = base64.b64decode(chunk, validate=True)\n                if len(ciphertext) != 512 or base64.b64encode(ciphertext).decode("ascii") != chunk:\n                    raise EnvelopeError()\n                os.lseek(key_fd, 0, os.SEEK_SET)\n                raw = _run(\n                    ["pkeyutl", "-decrypt", "-inkey", "/dev/fd/%d" % key_fd,\n                     *_options(session, field, index, len(chunks))], ciphertext, pass_fds=(key_fd,),\n                )\n                if not 1 <= len(raw) <= CHUNK_BYTES:\n                    raise EnvelopeError()\n                plaintext.append(raw)\n            credentials[field] = b"".join(plaintext).decode("utf-8")\n        _credentials(credentials)\n        return credentials\n    except Exception:\n        raise EnvelopeError() from None\n    finally:\n        for fd in (key_fd, directory_fd, root_fd):\n            if fd is not None:\n                os.close(fd)\n\n\ndef destroy_session(session, root: Path = Path("/run")) -> None:\n    root_fd = directory_fd = key_fd = None\n    try:\n        _session(session)\n        root_fd = _root_fd(root)\n        try:\n            directory_fd = _session_fd(root_fd, session)\n        except FileNotFoundError:\n            return\n        if set(os.listdir(directory_fd)) - {KEY_FILE}:\n            raise EnvelopeError()\n        try:\n            key_fd = os.open(KEY_FILE, _FILE_FLAGS, dir_fd=directory_fd)\n        except FileNotFoundError:\n            pass\n        else:\n            _private_stat(key_fd, 0o600)\n            os.unlink(KEY_FILE, dir_fd=directory_fd)\n        os.rmdir(session, dir_fd=root_fd)\n    except Exception:\n        raise EnvelopeError() from None\n    finally:\n        for fd in (key_fd, directory_fd, root_fd):\n            if fd is not None:\n                os.close(fd)\n'
          PROBE_SOURCE = '"""Two fixed, authorized Databento downloads through the deployed agent bridge.\n\nrun_checks receives decrypted credentials in memory in an isolated /opt/kalshi\nprocess. It never invokes a real model, database, orders, or service mutations.\nOnly counts, timestamps, cost telemetry and guard/cache outcomes are returned.\n"""\nimport contextlib\nfrom datetime import datetime, timezone\nfrom decimal import Decimal\nimport io\nimport json\nimport logging\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\n\n\nROOT = Path("/opt/kalshi")\nSTART = datetime(2026, 10, 16, 14, 0, tzinfo=timezone.utc)\nEND = datetime(2026, 10, 16, 14, 10, tzinfo=timezone.utc)\nTARGETS = (("EQUS.MINI", "SPY"), ("GLBX.MDP3", "ESZ6"))\nSETTINGS = {\n    "TAU_ALPACA_ENABLED": "0", "TAU_MASSIVE_ENABLED": "0",\n    "TAU_EXA_ENABLED": "0", "TAU_WORLDMONITOR_ENABLED": "0",\n    "TAU_DATABENTO_ENABLED": "1", "TAU_DATABENTO_DATASETS": "EQUS.MINI,GLBX.MDP3",\n    "TAU_DATABENTO_DEFAULT_DATASET": "EQUS.MINI", "TAU_DATABENTO_MAX_COST_USD": "0",\n    "TAU_MARKET_DATA_PRIMARY": "databento", "PYTHONDONTWRITEBYTECODE": "1",\n}\n\n\ndef actual_worker_environment():\n    result = subprocess.run(\n        ["systemctl", "show", "recursive-agents", "--property=MainPID", "--value"],\n        stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True, timeout=10,\n    )\n    pid = int(result.stdout.strip())\n    if pid <= 0:\n        raise RuntimeError("NoRunningWorker")\n    proc = Path("/proc") / str(pid)\n    if (proc / "cwd").resolve() != ROOT:\n        raise RuntimeError("UnexpectedWorkerDirectory")\n    env = dict(item.decode("utf-8", "replace").split("=", 1)\n               for item in (proc / "environ").read_bytes().split(b"\\0") if b"=" in item)\n    return pid, env\n\n\ndef _summary(packet):\n    result = {key: packet[key] for key in (\n        "provider", "status", "code", "feed", "dataset", "timeframe", "schema",\n        "requested_start", "requested_end_exclusive", "start", "end_exclusive",\n        "availability_clipped", "complete", "estimated_cost_usd", "reserved_cost_usd",\n        "budget_limit_usd", "cache_hit", "download_started", "excluded_bars",\n    ) if key in packet}\n    result["symbols"] = {\n        symbol: {key: row[key] for key in ("status", "bar_count", "first_bar", "last_completed_at") if key in row}\n        for symbol, row in packet.get("symbols", {}).items()\n    }\n    result["completed_intervals_within_training_window"] = all(\n        START <= datetime.fromisoformat(bar["timestamp"].replace("Z", "+00:00"))\n        < datetime.fromisoformat(bar["interval_end"].replace("Z", "+00:00")) <= END\n        for row in packet.get("symbols", {}).values() for bar in row.get("sample", [])\n    )\n    return result\n\n\ndef run_checks(credentials):\n    if not isinstance(credentials, dict) or not isinstance(credentials.get("DATABENTO_API_KEY"), str) or not credentials["DATABENTO_API_KEY"]:\n        raise RuntimeError("MissingDiagnosticCredentials")\n    _, worker_env = actual_worker_environment()\n    original_env, original_cwd = dict(os.environ), Path.cwd()\n    original_path = list(sys.path)\n    original_bytecode, original_logging = sys.dont_write_bytecode, logging.root.manager.disable\n    market_module = original_client = None\n    output = {\n        "mode": "isolated_authorized_databento_followup", "source_host": "production_web_box",\n        "model_backend": "scripted_no_llm", "real_model_calls": 0,\n        "production_worker_modified": False, "credentials_persisted": False,\n        "database_or_order_actions": False, "diagnostic_configured_cost_cap_usd": "0",\n        "funding_policy": "exact_fresh_validated_quote_for_each_of_two_fixed_downloads",\n        "training_start": START.isoformat(), "training_cutoff": END.isoformat(),\n        "paid_download_attempt_limit": 2, "http_attempts": {}, "funded_quotes": [],\n        "events": [], "checks": [], "scripted_model_calls": 0,\n    }\n    try:\n        os.environ.clear()\n        os.environ.update(worker_env)\n        os.environ.update(credentials)\n        os.environ.update(SETTINGS)\n        os.chdir(ROOT)\n        sys.path.insert(0, str(ROOT))\n        sys.dont_write_bytecode = True\n        logging.disable(logging.CRITICAL)\n        from app import agent_market_data as market_module\n        from app.databento_data import CostBudget, DatabentoDataClient, MarketDataError\n        from app.llm import Usage\n\n        original_client = market_module.DatabentoDataClient\n        with market_module._CACHE_LOCK:\n            market_module._CACHE.clear()\n        paid_attempts = 0\n\n        class FundedClient(DatabentoDataClient):\n            """Retain the real adapter\'s planning, reservation and transport guards."""\n            def __init__(self, config, **kwargs):\n                callback = kwargs.pop("before_request", lambda: None)\n                self.active_path = None\n\n                def before_request():\n                    nonlocal paid_attempts\n                    callback()\n                    if self.active_path == "timeseries.get_range":\n                        if paid_attempts >= 2:\n                            raise MarketDataError("request_limit", "The diagnostic paid-attempt limit is exhausted.")\n                        paid_attempts += 1\n                    output["http_attempts"][self.active_path] = output["http_attempts"].get(self.active_path, 0) + 1\n\n                super().__init__(config, before_request=before_request, **kwargs)\n                if config.max_cost_usd != Decimal("0") or not isinstance(self.budget, CostBudget):\n                    raise RuntimeError("UnexpectedDiagnosticBudget")\n\n            def _http(self, path, params):\n                self.active_path = path\n                return super()._http(path, params)\n\n            def _plan(self, symbols, dataset, start, end, timeframe):\n                if ((dataset, tuple(symbols)) not in {(d, (s,)) for d, s in TARGETS}\n                        or start != START or end != END or timeframe != "1Min"):\n                    raise MarketDataError("invalid_request", "The diagnostic permits only its fixed completed windows.")\n                params, metadata = super()._plan(symbols, dataset, start, end, timeframe)\n                quote = Decimal(metadata["estimated_cost_usd"])\n                # The deployed planner already checked the estimate. Fund exactly\n                # that quote in this temporary object; real bars() still calls\n                # the unchanged CostBudget.reserve before its one paid attempt.\n                if not quote.is_finite() or quote < 0 or len(output["funded_quotes"]) >= 2:\n                    raise MarketDataError("invalid_cost", "The diagnostic cannot fund this estimate.")\n                with self.budget._lock:\n                    self.budget.limit = self.budget.reserved + quote\n                output["funded_quotes"].append({\n                    "dataset": dataset, "symbol": symbols[0], "estimated_cost_usd": str(quote),\n                    "start": metadata["start"], "end_exclusive": metadata["end_exclusive"],\n                })\n                return params, metadata\n\n        market_module.DatabentoDataClient = FundedClient\n        requests = [{"provider": "databento", "kind": "bars", "dataset": dataset,\n                     "symbols": [symbol], "timeframe": "1Min", "lookback_days": 1}\n                    for dataset, symbol in TARGETS]\n        first_packets, repeated_packets = [], []\n        cache_start = None\n\n        def event(kind, message, data=None):\n            if isinstance(data, dict) and isinstance(data.get("market_data"), dict):\n                output["events"].append({"event_kind": kind, **_summary(data["market_data"])})\n\n        def model(system, messages):\n            nonlocal cache_start\n            output["scripted_model_calls"] += 1\n            text = system + json.dumps(messages)\n            if any(isinstance(value, str) and value and value in text for value in credentials.values()):\n                raise RuntimeError("SecretInModelContext")\n            call = output["scripted_model_calls"]\n            if call == 1:\n                answer = {"market_data_requests": requests}\n            else:\n                prefix, body = messages[-1]["content"].split("\\n", 1)\n                if prefix != "Read-only market-data results:":\n                    raise RuntimeError("UnexpectedBridgeContext")\n                rows = json.loads(body.split("\\nReturn the final task JSON", 1)[0])\n                packets = [row["data"] for row in rows]\n                if call == 2:\n                    first_packets.extend(packets)\n                    successful = [row["request"] for row in rows if row["data"].get("status") == "available"]\n                    if successful:\n                        cache_start = sum(output["http_attempts"].values())\n                        answer = {"market_data_requests": successful}\n                    else:\n                        answer = {"reply": "Diagnostic completed with unavailable data.", "actions": []}\n                elif call == 3:\n                    repeated_packets.extend(packets)\n                    answer = {"reply": "Diagnostic complete.", "actions": []}\n                else:\n                    raise RuntimeError("UnexpectedScriptedModelRound")\n            return json.dumps(answer), {"input_tokens": 0, "output_tokens": 0}\n\n        scope = market_module.DataScope.research(int(START.timestamp()), int(END.timestamp()))\n        context = market_module.AgentMarketData(scope, event)\n        with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):\n            final = context.ask(model, "Read-only diagnostic. Return no actions.",\n                                [{"role": "user", "content": "Verify the fixed historical windows."}],\n                                lambda obj: obj, Usage())\n        if final.get("actions") != []:\n            raise RuntimeError("UnexpectedActionPayload")\n        for index, packet in enumerate(first_packets):\n            output["checks"].append({"name": "historical_download_" + TARGETS[index][0], **_summary(packet)})\n        cache_http = None if cache_start is None else sum(output["http_attempts"].values()) - cache_start\n        output["checks"].append({\n            "name": "identical_request_cache", "status": "available" if repeated_packets else "skipped",\n            "repeat_count": len(repeated_packets), "additional_http_attempts": cache_http,\n            "all_cache_hits": bool(repeated_packets) and all(p.get("cache_hit") is True and p.get("download_started") is False for p in repeated_packets),\n        })\n        output["paid_download_attempts"] = paid_attempts\n        output["reserved_cost_usd"] = str(context.databento_budget.reserved) if context.databento_budget else None\n        output["temporary_budget_limit_usd"] = str(context.databento_budget.limit) if context.databento_budget else None\n        output["diagnostic_cap_env_unchanged"] = os.getenv("TAU_DATABENTO_MAX_COST_USD") == "0"\n        output["accepted"] = (\n            len(first_packets) == 2 and len(repeated_packets) == 2 and cache_http == 0\n            and all(p.get("status") == "available" and all(s.get("bar_count", 0) > 0 for s in p.get("symbols", {}).values()) for p in first_packets)\n            and all(p.get("cache_hit") is True and p.get("download_started") is False for p in repeated_packets)\n            and all(_summary(p)["completed_intervals_within_training_window"] for p in first_packets)\n            and paid_attempts == 2 and output["diagnostic_cap_env_unchanged"]\n        )\n        serialized = json.dumps(output)\n        if any(isinstance(value, str) and value and value in serialized for value in credentials.values()):\n            raise RuntimeError("SecretInReceipt")\n        return output\n    finally:\n        if market_module is not None and original_client is not None:\n            market_module.DatabentoDataClient = original_client\n        os.environ.clear()\n        os.environ.update(original_env)\n        os.chdir(original_cwd)\n        sys.path[:] = original_path\n        sys.dont_write_bytecode = original_bytecode\n        logging.disable(original_logging)\n'
          """Transport only ciphertext; keep provider secrets in memory on both hosts."""
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import subprocess
          import sys
          import tempfile
          import time
          import uuid
          import zlib

          REPO_REGION = 'us-east-1'
          INSTANCE = 'i-077d6f7873e7836ba'
          BUCKET = 'kalshi-trade-artifacts-568386354218-us-east-1'
          STATE = Path(os.environ.get('TAU_PROBE_STATE', '/tmp/tau-provider-probe-state.json'))


          def aws(*args):
              response = subprocess.run(['aws', *args, '--region', REPO_REGION, '--output', 'json'],
                                        capture_output=True, text=True, timeout=45)
              if response.returncode:
                  match = re.search(r'An error occurred \(([A-Za-z0-9_.-]+)\)', response.stderr)
                  raise RuntimeError('AWS request failed: ' + (match.group(1) if match else 'AwsCliError'))
              return json.loads(response.stdout) if response.stdout.strip() else {}


          def remote(program, comment, timeout=600):
              encoded = base64.b64encode(zlib.compress(program.encode())).decode()
              launcher = 'import base64,zlib;exec(zlib.decompress(base64.b64decode(' + repr(encoded) + ')))'
              command = '/opt/kalshi/.venv313/bin/python -B -c ' + shlex.quote(launcher)
              sent = aws('ssm', 'send-command', '--instance-ids', INSTANCE, '--document-name', 'AWS-RunShellScript',
                         '--comment', comment, '--parameters', json.dumps({'commands': [command], 'executionTimeout': [str(timeout)]}))
              command_id = sent['Command']['CommandId']
              print(json.dumps({'ssm_command_id': command_id, 'phase': comment}), flush=True)
              response = None
              for _ in range(timeout // 3 + 5):
                  time.sleep(3)
                  try:
                      response = aws('ssm', 'get-command-invocation', '--command-id', command_id, '--instance-id', INSTANCE)
                  except RuntimeError as exc:
                      if 'InvocationDoesNotExist' in str(exc):
                          continue
                      raise
                  if response['Status'] in ('Success', 'Failed', 'TimedOut', 'Cancelled'):
                      break
              if not response:
                  raise RuntimeError('No SSM result')
              try:
                  body = json.loads(response.get('StandardOutputContent', '').strip())
              except (ValueError, TypeError):
                  raise RuntimeError('SSM returned no valid redacted JSON') from None
              if response['Status'] != 'Success':
                  print('TAU_PROVIDER_PHASE_ERROR=' + json.dumps(body), flush=True)
                  raise RuntimeError('SSM phase did not succeed: ' + response['Status'])
              return body


          def cleanup(session):
