          PROBE_SOURCE = '"""Stage authorized provider configuration; restart only an observed idle agent.\n\nThe caller injects HELPER_SOURCE from the reviewed configure_market_data.py.\nNo provider/model requests, queue writes, auth changes or order operations occur.\nPrivate files contain credentials; returned evidence never does.\n"""\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport shlex\nimport stat\nimport subprocess\nimport sys\nimport tempfile\nimport time\n\n\nROOT = Path(\'/opt/kalshi\')\nCONFIG_ROOT = Path(\'/etc/tau/provider-data\')\nSERVICE = \'recursive-agents\'\nDROP_DIR = Path(\'/etc/systemd/system/recursive-agents.service.d\')\nDROP = DROP_DIR / \'90-tau-provider-data.conf\'\nMARKET, RESEARCH = CONFIG_ROOT / \'market-data.env\', CONFIG_ROOT / \'research-data.env\'\nKEYS = (\'APCA_API_KEY_ID\', \'APCA_API_SECRET_KEY\', \'MASSIVE_API_KEY\', \'DATABENTO_API_KEY\', \'EXA_API_KEY\')\nSETTINGS = {\n    \'TAU_MARKET_DATA_PRIMARY\': \'databento\', \'TAU_DATABENTO_ENABLED\': \'1\',\n    \'TAU_DATABENTO_DATASETS\': \'EQUS.MINI,GLBX.MDP3\', \'TAU_DATABENTO_DEFAULT_DATASET\': \'EQUS.MINI\',\n    \'TAU_DATABENTO_MAX_COST_USD\': \'0.10\', \'TAU_ALPACA_ENABLED\': \'1\', \'TAU_ALPACA_FEED\': \'iex\',\n    \'TAU_ALPACA_SYMBOLS\': \'SPY,QQQ,IWM,TLT,GLD,USO\', \'ALPACA_DATA_ENDPOINT\': \'https://data.alpaca.markets\',\n    \'TAU_MASSIVE_ENABLED\': \'1\', \'TAU_MASSIVE_FX_FEED\': \'end_of_day\',\n    \'TAU_MASSIVE_FX_SYMBOLS\': \'EURUSD,USDJPY,GBPUSD\',\n    \'TAU_MASSIVE_DATASETS\': \'fx,treasury_yields,funding_conditions\',\n    \'TAU_EXA_ENABLED\': \'1\', \'TAU_EXA_HISTORICAL_ENABLED\': \'1\',\n}\nRESOURCE_KEYS = (\'MemoryMax\', \'MemoryHigh\', \'MemorySwapMax\', \'Nice\', \'TimeoutStartUSec\',\n                 \'TimeoutStopUSec\', \'Restart\', \'RestartUSec\', \'KillMode\', \'KillSignal\', \'User\', \'Group\')\nOTHER_SERVICES = (\'recursive-web\', \'recursive-engine\')\nPROTECTED_PREFIXES = (\'APP_\', \'MYSQL_\', \'PROD_\', \'KALSHI_\', \'LIVE_\', \'DASHBOARD_\', \'GOOGLE_\',\n                      \'STRIPE_\', \'AWS_\', \'TAU_\', \'ALPACA_OAUTH_\', \'IBKR_\', \'ROBINHOOD_\', \'ANTHROPIC_\')\n\n\nclass ActivationError(RuntimeError):\n    def __init__(self, code, metadata=None):\n        self.code = code\n        self.metadata = metadata\n        super().__init__(\'Provider activation operation failed.\')\n\n\ndef command(args, *, env=None, stdin=None, timeout=20):\n    result = subprocess.run(args, input=stdin, cwd=ROOT, env=env, capture_output=True,\n                            text=True, timeout=timeout)\n    if result.returncode:\n        raise ActivationError(\'child_command_failed\')\n    return result.stdout\n\n\ndef properties(service):\n    names = (\'MainPID\', \'ActiveState\', \'SubState\', \'FragmentPath\', \'DropInPaths\', *RESOURCE_KEYS)\n    text = command([\'systemctl\', \'show\', service, \'--property=\' + \',\'.join(names)])\n    return dict(line.split(\'=\', 1) for line in text.splitlines() if \'=\' in line)\n\n\ndef secure_directory(path):\n    for directory in (Path(\'/\'), *reversed(path.parents), path):\n        info = directory.lstat()\n        if not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:\n            allowed = {CONFIG_ROOT, CONFIG_ROOT.parent, DROP_DIR, *DROP_DIR.parents}\n            metadata = ({\'path\': str(directory), \'mode\': format(stat.S_IMODE(info.st_mode), \'04o\'),\n                         \'owner_is_root\': info.st_uid == 0} if directory in allowed else None)\n            raise ActivationError(\'unsafe_directory\', metadata)\n\n\ndef prepare_config_directory(created=None):\n    created = [] if created is None else created\n    for path in (CONFIG_ROOT.parent, CONFIG_ROOT):\n        secure_directory(path.parent)\n        try:\n            path.mkdir(mode=0o700)\n            created.append(path)\n        except FileExistsError:\n            pass\n        secure_directory(path)\n        if path == CONFIG_ROOT and stat.S_IMODE(path.lstat().st_mode) != 0o700:\n            raise ActivationError(\'unsafe_private_directory\', {\n                \'path\': str(path), \'mode\': format(stat.S_IMODE(path.lstat().st_mode), \'04o\'),\n                \'owner_is_root\': path.lstat().st_uid == 0})\n    return created\n\n\ndef file_signature(info):\n    return (info.st_dev, info.st_ino, info.st_uid, info.st_gid, info.st_mode,\n            info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns)\n\n\ndef existing_base_snapshot(path):\n    """Only observe the two existing base files; never impose new ownership/modes."""\n    if path not in {ROOT / \'.env.aws\', ROOT / \'.env.app\'}:\n        raise ActivationError(\'unrecognized_existing_base_path\')\n    parent = os.open(\'/\', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\n    descriptor = None\n    try:\n        for component in path.parent.parts[1:]:\n            child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent)\n            os.close(parent)\n            parent = child\n        try:\n            before = os.stat(path.name, dir_fd=parent, follow_symlinks=False)\n        except FileNotFoundError:\n            return None\n        if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > 262144:\n            raise ActivationError(\'unsafe_existing_base_file\')\n        descriptor = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=parent)\n        raw = os.read(descriptor, 262145)\n        after = os.fstat(descriptor)\n        named = os.stat(path.name, dir_fd=parent, follow_symlinks=False)\n        if file_signature(before) != file_signature(after) or file_signature(after) != file_signature(named) or len(raw) != after.st_size:\n            raise ActivationError(\'existing_base_changed_during_read\')\n        return {\'raw\': raw, \'signature\': file_signature(after), \'sha256\': hashlib.sha256(raw).hexdigest()}\n    finally:\n        if descriptor is not None:\n            os.close(descriptor)\n        os.close(parent)\n\n\ndef snapshot(path, private=False):\n    if path in {ROOT / \'.env.aws\', ROOT / \'.env.app\'}:\n        return existing_base_snapshot(path)\n    secure_directory(path.parent)\n    try:\n        before = path.lstat()\n    except FileNotFoundError:\n        return None\n    if (not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_nlink != 1\n            or before.st_mode & (0o077 if private else 0o022) or before.st_size > 262144):\n        raise ActivationError(\'unsafe_private_file\' if private else \'unsafe_unit_file\')\n    descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)\n    try:\n        raw = os.read(descriptor, 262145)\n        after = os.fstat(descriptor)\n        if file_signature(before) != file_signature(after) or len(raw) != after.st_size:\n            raise ActivationError(\'file_changed_during_read\')\n        return {\'raw\': raw, \'signature\': file_signature(after), \'sha256\': hashlib.sha256(raw).hexdigest()}\n    finally:\n        os.close(descriptor)\n\n\ndef unchanged(path, expected, private=False):\n    current = snapshot(path, private)\n    if current != expected:\n        raise ActivationError(\'concurrent_file_change\')\n\n\ndef atomic_write(path, raw, expected, mode=0o600):\n    unchanged(path, expected, private=True)\n    descriptor, temporary = tempfile.mkstemp(prefix=\'.tau-provider-\', dir=path.parent)\n    try:\n        with os.fdopen(descriptor, \'wb\') as stream:\n            os.fchmod(stream.fileno(), mode)\n            stream.write(raw)\n            stream.flush()\n            os.fsync(stream.fileno())\n        unchanged(path, expected, private=True)\n        os.replace(temporary, path)\n    finally:\n        if os.path.exists(temporary):\n            os.unlink(temporary)\n    return snapshot(path, private=True)\n\n\ndef worker():\n    props = properties(SERVICE)\n    pid = int(props.get(\'MainPID\') or 0)\n    if pid <= 0 or props.get(\'ActiveState\') != \'active\':\n        raise ActivationError(\'no_running_worker\')\n    proc = Path(\'/proc\') / str(pid)\n    argv = [item.decode() for item in (proc / \'cmdline\').read_bytes().split(b\'\\0\') if item]\n    if ((proc / \'cwd\').resolve() != ROOT or not argv\n            or not re.fullmatch(r\'/opt/kalshi/\\.venv313/bin/python(?:3(?:\\.13)?)?\', argv[0])\n            or not any(argv[index:index + 3] == [\'-m\', \'app.worker\', \'agents\'] for index in range(len(argv)))):\n        raise ActivationError(\'unexpected_worker_layout\')\n    env = dict(item.decode().split(\'=\', 1) for item in (proc / \'environ\').read_bytes().split(b\'\\0\') if b\'=\' in item)\n    return props, pid, argv[0], env\n\n\ndef other_pids():\n    return {service: int(properties(service).get(\'MainPID\') or 0) for service in OTHER_SERVICES}\n\n\ndef protected(env):\n    managed = set(SETTINGS) | set(KEYS)\n    return {key: value for key, value in env.items() if key.startswith(PROTECTED_PREFIXES) and key not in managed}\n\n\ndef unit_plan(props, interpreter):\n    fragment = Path(props.get(\'FragmentPath\', \'\'))\n    if not re.fullmatch(r\'/(?:etc|run|usr/lib)/systemd/system/recursive-agents\\.service\', str(fragment)):\n        raise ActivationError(\'unexpected_unit_path\')\n    saved = {fragment: snapshot(fragment)}\n    lines = saved[fragment][\'raw\'].decode().splitlines()\n    starts = [line.strip() for line in lines if line.strip().startswith(\'ExecStart=\')]\n    if len(starts) != 1 or \'\\\\\' in starts[0]:\n        raise ActivationError(\'unexpected_exec_start_count\')\n    args = shlex.split(starts[0].split(\'=\', 1)[1])\n    if len(args) != 3 or args[0] != \'/bin/bash\' or args[1] not in (\'-c\', \'-ec\', \'-ce\'):\n        raise ActivationError(\'unexpected_launcher\')\n    body = args[2]\n    layout = (r\'set -a;\\s*\\. /opt/kalshi/\\.env\\.aws;\\s*\\. /opt/kalshi/\\.env\\.app;\\s*\'\n              r\'set \\+a;\\s*unset AWS_PROFILE;\\s*exec \' + re.escap