name: Wait for research before approved provider activation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-provider-acceptance
  cancel-in-progress: false

jobs:
  providers:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    env:
      TAU_PROBE_STATE: /tmp/tau-provider-probe-state-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Inspect without mutation while busy; activate only after observed quiescence
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          python3 - <<'PY'
          EXPECTED_SETTINGS = {'TAU_MARKET_DATA_PRIMARY': 'databento', 'TAU_DATABENTO_ENABLED': '1', 'TAU_DATABENTO_DATASETS': 'EQUS.MINI,GLBX.MDP3', 'TAU_DATABENTO_DEFAULT_DATASET': 'EQUS.MINI', 'TAU_DATABENTO_MAX_COST_USD': '0.10', 'TAU_ALPACA_ENABLED': '1', 'TAU_ALPACA_FEED': 'iex', 'TAU_ALPACA_SYMBOLS': 'SPY,QQQ,IWM,TLT,GLD,USO', 'ALPACA_DATA_ENDPOINT': 'https://data.alpaca.markets', 'TAU_MASSIVE_ENABLED': '1', 'TAU_MASSIVE_FX_FEED': 'end_of_day', 'TAU_MASSIVE_FX_SYMBOLS': 'EURUSD,USDJPY,GBPUSD', 'TAU_MASSIVE_DATASETS': 'fx,treasury_yields,funding_conditions', 'TAU_EXA_ENABLED': '1', 'TAU_EXA_HISTORICAL_ENABLED': '1'}
          EXPECTED_APP_HASHES = {'app/agent_market_data.py': '0c72ae87cfdca397e20da32daee8c1714e6fc20ed51b23ce464d1bad498f9e23', 'app/market_data_config.py': '97aebd2239d731fa0e6c5c884b7868753e16b8947d2670dbf5faf71afd5dff7a', 'app/alpaca_data.py': 'dafa504eeceaacead9a7309c29f5c3dea029307528fa8ddd76b335eee02ed81f', 'app/massive_data.py': '467e35ba260c689f34c0354562dbc871f153cd427d576a57ccfb1302965f2740', 'app/databento_data.py': 'db718faa226649d0c90abf346932fc71d8da6d59dd9587a30b7e784d72bb7f1b', 'app/exa_data.py': '86deda15a0656e6c9873644c1ecb2eb1d91d66731189419cc507da016a7154a0', 'app/agent_knowledge.py': '3e4326dd2246fb9fb3fb6cc730d7b23a326e034f427ff2d38956503e1339179f', 'app/worker.py': 'b309759e3f66aa5543922d45bc592e1bb0c42408f5832375a9067a891f0e1fa5'}
          EXPECTED_UNIT_HASHES = {'fragment': '80573f379d9789f0d448b0108c025182c3de38d93fe9213a1dadc80772c1e6bb'}
          EXPECTED_SERVICE_SETTINGS = {'Restart': 'always', 'RestartUSec': '10s', 'TimeoutStartUSec': '1min 30s', 'TimeoutStopUSec': '30s', 'MemoryHigh': 'infinity', 'MemoryMax': '419430400', 'MemorySwapMax': 'infinity', 'Nice': '5', 'KillMode': 'control-group', 'KillSignal': '15'}
          WAIT_INVENTORY_SOURCE = '"""Read-only activation inventory. Never print raw environments, units or SQL errors."""\nimport contextlib\nfrom datetime import datetime, timezone\nfrom decimal import Decimal\nimport hashlib\nimport io\nimport json\nimport logging\nimport os\nfrom pathlib import Path\nimport re\nimport shlex\nimport stat\nimport subprocess\nimport sys\n\nROOT = Path("/opt/kalshi")\nCONFIG_ROOT = Path("/etc/tau/provider-data")\nPROVIDER_DROP = Path("/etc/systemd/system/recursive-agents.service.d/90-tau-provider-data.conf")\nSERVICE = "recursive-agents"\nKEYS = ("APCA_API_KEY_ID", "APCA_API_SECRET_KEY", "MASSIVE_API_KEY", "DATABENTO_API_KEY", "EXA_API_KEY", "APP_SECRET_KEY", "ANTHROPIC_API_KEY")\nENUMS = {\n    "TAU_MARKET_DATA_PRIMARY": {"alpaca", "databento"},\n    "TAU_ALPACA_FEED": {"iex", "sip"},\n    "TAU_MASSIVE_FX_FEED": {"end_of_day", "realtime"},\n    "ALPACA_DATA_ENDPOINT": {"https://data.alpaca.markets"},\n}\nFLAGS = ("TAU_ALPACA_ENABLED", "TAU_MASSIVE_ENABLED", "TAU_DATABENTO_ENABLED", "TAU_EXA_ENABLED", "TAU_EXA_HISTORICAL_ENABLED", "TAU_WORLDMONITOR_ENABLED")\nNUMBERS = ("APP_AGENT_CONCURRENCY", "APP_COPILOT_REVIEW_SECONDS", "APP_AUTOPILOT_MIN_REVIEW_SECONDS", "TAU_DATABENTO_MAX_COST_USD")\nLISTS = ("TAU_DATABENTO_DATASETS", "TAU_DATABENTO_DEFAULT_DATASET", "TAU_MASSIVE_DATASETS", "TAU_ALPACA_SYMBOLS", "TAU_MASSIVE_FX_SYMBOLS")\nSOURCE_FILES = ("app/agent_market_data.py", "app/market_data_config.py", "app/alpaca_data.py", "app/massive_data.py", "app/databento_data.py", "app/exa_data.py", "app/agent_knowledge.py", "app/worker.py", "scripts/configure_market_data.py")\nMARKET_ASSIGNMENTS = set(ENUMS) | set(LISTS) | {\n    "TAU_ALPACA_ENABLED", "TAU_MASSIVE_ENABLED", "TAU_DATABENTO_ENABLED", "TAU_DATABENTO_MAX_COST_USD",\n    "APCA_API_KEY_ID", "APCA_API_SECRET_KEY", "MASSIVE_API_KEY", "DATABENTO_API_KEY",\n}\nRESEARCH_ASSIGNMENTS = {"EXA_API_KEY", "TAU_EXA_ENABLED", "TAU_EXA_HISTORICAL_ENABLED"}\n\n\ndef _secret_values(env):\n    return [value for key, value in env.items() if re.search(r"KEY|SECRET|TOKEN|PASSWORD", key)\n            and isinstance(value, str) and len(value) >= 8]\n\n\ndef safe_settings(env):\n    result, sensitive = {}, _secret_values(env)\n    for name in (*FLAGS, *ENUMS, *NUMBERS, *LISTS):\n        value = env.get(name)\n        if value is None:\n            result[name] = None\n            continue\n        valid = isinstance(value, str) and len(value) <= 256 and not any(secret in value for secret in sensitive)\n        if valid and name in FLAGS:\n            valid = value in {"0", "1"}\n        elif valid and name in ENUMS:\n            valid = value in ENUMS[name]\n        elif valid and name in NUMBERS:\n            try:\n                amount = Decimal(value)\n                valid = bool(re.fullmatch(r"[0-9.eE+-]{1,64}", value)) and amount.is_finite() and amount >= 0\n            except Exception:\n                valid = False\n        elif valid:\n            parts = [part.strip() for part in value.split(",")]\n            if name.startswith("TAU_DATABENTO_"):\n                valid = len(parts) <= 8 and all(re.fullmatch(r"[A-Z0-9]{3,8}\\.[A-Z0-9]{2,16}", part) for part in parts)\n            elif name == "TAU_MASSIVE_DATASETS":\n                valid = len(parts) <= 4 and set(parts) <= {"fx", "treasury_yields", "funding_conditions", "options"}\n            elif name == "TAU_ALPACA_SYMBOLS":\n                valid = len(parts) <= 8 and all(re.fullmatch(r"[A-Z][A-Z0-9.-]{0,14}", part) for part in parts)\n            else:\n                valid = len(parts) <= 3 and all(re.fullmatch(r"(?:C:)?[A-Z]{3}/?[A-Z]{3}", part) for part in parts)\n        result[name] = value if valid else "[invalid_or_redacted]"\n    return {"credential_presence": {key: bool(env.get(key)) for key in KEYS}, "settings": result}\n\n\ndef classify_exec_start(text, interpreter=None):\n    text = re.sub(r"\\\\x([0-9a-fA-F]{2})", lambda match: chr(int(match[1], 16)), text)\n    sources = [match[1] for match in re.finditer(r"(?:^|[;\\s\'\\"])(?:source|\\.)\\s+[\'\\"]?/opt/kalshi/(\\.env\\.(?:aws|app|market-data|research-data))(?=[\'\\";\\s]|$)", text)]\n    python = re.search(r"(/opt/kalshi/\\.venv(?:313)?/bin/python(?:3(?:\\.\\d{1,2})?)?)(?=\\s|[\'\\"]|$)", text)\n    result = {\n        "uses_bash": "/bin/bash" in text,\n        "uses_bash_c": bool(re.search(r"/bin/bash\\s+-[a-zA-Z]*c[a-zA-Z]*(?=\\s|[\'\\"]|$)", text)),\n        "module_app_worker_agents": bool(re.search(r"-m\\s+app\\.worker\\s+agents(?=\\s|[;\'\\"]|$)", text)),\n        "sources_in_order": sources,\n        "sources_base_aws_then_app": ".env.aws" in sources and ".env.app" in sources and sources.index(".env.aws") < sources.index(".env.app"),\n        "uses_set_a": bool(re.search(r"(?:^|[;\\s\'\\"])set\\s+-a(?=\\s|;|$)", text)),\n        "unsets_aws_profile": bool(re.search(r"unset\\s+AWS_PROFILE(?=\\s|;|$)", text)),\n        "logging_redirected": bool(re.search(r">{1,2}\\s*/opt/kalshi/logs/recursive_agents\\.log", text)),\n        "stderr_joined_to_stdout": "2>&1" in text,\n        "interpreter_matches_mainpid": bool(python and interpreter and python[1] == interpreter),\n        "exec_start_mentions_market_preflight": "app.market_data_config" in text,\n        "exec_start_resets_definition": bool(re.search(r"(?m)^ExecStart=\\s*$", text)),\n    }\n    result["recognized_base_shell_layout"] = all(result[key] for key in ("uses_bash_c", "module_app_worker_agents", "sources_base_aws_then_app", "uses_set_a"))\n    return result\n\n\ndef _directory(path):\n    result = {"exists": False}\n    try:\n        info = path.lstat()\n        result.update(exists=True, mode=format(stat.S_IMODE(info.st_mode), "04o"),\n                      owner_is_root=info.st_uid == 0, symlink=stat.S_ISLNK(info.st_mode),\n                      directory=stat.S_ISDIR(info.st_mode))\n        result["parent_chain_secure"] = all(\n            stat.S_ISDIR(parent.lstat().st_mode) and parent.lstat().st_uid == 0\n            and not parent.lstat().st_mode & 0o022\n            for parent in path.parents\n        )\n    except FileNotFoundError:\n        pass\n    except Exception:\n        result["status"] = "metadata_read_failed"\n    return result\n\n\ndef _no_unrecognized_pending_dropins():\n    try:\n        for directory in (Path(\'/etc/systemd/system/recursive-agents.service.d\'),\n                          Path(\'/run/systemd/system/recursive-agents.service.d\'),\n                          Path(\'/usr/lib/systemd/system/recursive-agents.service.d\')):\n            try:\n                info = directory.lstat()\n            except FileNotFoundError:\n                continue\n            if not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:\n                return False\n            if any(path != PROVIDER_DROP for path in directory.glob(\'*.conf\')):\n                return False\n        return True\n    except Exception:\n        return False\n\n\ndef _staged_startup(fragment, interpreter):\n    """Recompute the reviewed drop-in privately; return booleans and a code only."""\n    result = {"status": "unrecognized", "provider_dropin_matches_expected": False}\n    descriptor = None\n    try:\n        if not re.fullmatch(r"/(?:etc|run|usr/lib)/systemd/system/recursive-agents\\.service", fragment):\n            return result\n        descriptor = os.open(fragment, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)\n        info = os.fstat(descriptor)\n        if not stat.S_ISREG(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022 or info.st_size > 262144:\n            return result\n        raw = os.read(descriptor, 262145)\n        lines = [line.strip() for line in raw.decode().splitlines() if line.strip().startswith("ExecStart=")]\n        if len(lines) != 1 or "\\\\" in lines[0]:\n            return result\n        args = shlex.split(lines[0].split("=", 1)[1])\n        if len(args) != 3 or args[0] != "/bin/bash" or args[1] not in ("-c", "-ec", "-ce"):\n            return result\n        body = args[2]\n        pattern = (r"set -a;\\s*\\. /opt/kalshi/\\.env\\.aws;\\s*\\. /opt/kalshi/\\.env\\.app;\\s*"\n                   r"set \\+a;\\s*unset AWS_PROFILE;\\s*exec " + re.escape(interpreter)\n                   + r" -u -m app\\.worker agents\\s*>>\\s*/opt/kalshi/logs/recursive_agents\\.log\\s*2>&1")\n        if not re.fullmatch(pattern, body) or body.count("set +a;") != 1:\n            return result\n        insertion = (". " + shlex.quote(str(CONFIG_ROOT / "market-data.env")) + " || exit $?; "\n                     ". " + shlex.quote(str(CONFIG_ROOT / "research-data.env")) + " || exit $?; "\n                     + interpreter + " -B -m app.market_data_config check >/dev/null || exit $?; ")\n        patched = body.replace("set +a;", insertion + "set +a;", 1)\n        expected = ("[Service]\\nExecStart=\\nExecStart=" + args[0] + " " + args[1] + " " + shlex.quote(patched) + "\\n").encode()\n        drop = _file(PROVIDER_DROP, hashed=True)\n        matches = drop.get("sha256") == hashlib.sha256(expected).hexdigest()\n        return {"status": "recognized", "fragment_launch_compatible": True,\n                "provider_dropin_matches_expected": matches}\n    except Exception:\n        return result\n    finally:\n        if descriptor is not None:\n            os.close(descriptor)\n\n\ndef _file(path, *, hashed=False, overlay=False, secrets=()):\n    result = {"exists": False}\n    fd = None\n    try:\n        info = path.lstat()\n        result.update(exists=True, mode=format(stat.S_IMODE(info.st_mode), "04o"),\n                      size_bytes=info.st_size, owner_is_root=info.st_uid == 0,\n                      symlink=stat.S_ISLNK(info.st_mode), regular_file=stat.S_ISREG(info.st_mode),\n                      modified_at_utc=datetime.fromtimestamp(info.st_mtime, timezone.utc).isoformat())\n        if not stat.S_ISREG(info.st_mode):\n            return result\n        if overlay and (stat.S_IMODE(info.st_mode) & 0o077):\n            result["content_read"] = "withheld_insecure_permissions"\n            return result\n        if not (hashed or overlay):\n            return result\n        fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)\n        if not os.path.samestat(info, os.fstat(fd)) or info.st_size > 1024 * 1024:\n            result["content_read"] = "withheld_changed_or_large_file"\n            return result\n        raw = os.read(fd, 1024 * 1024 + 1)\n        if len(raw) > 1024 * 1024:\n            result["content_read"] = "withheld_large_file"\n            return result\n        text = raw.decode("utf-8")\n        if hashed:\n            unit = path.suffix in {".service", ".conf"}\n            sensitive = any(secret in text for secret in secrets) or (unit and bool(re.search(r"\\b[A-Z_][A-Z0-9_]*(?:KEY|SECRET|TOKEN|PASSWORD)[A-Z0-9_]*\\s*=", text)))\n            result["sha256"] = None if sensitive else hashlib.sha256(raw).hexdigest()\n            result["hash_withheld_sensitive_content"] = sensitive\n            if path.suffix in {".service", ".conf"}:\n                result["structure"] = classify_exec_start(text)\n                result["environment_file_mentions"] = [name for name in (".env.aws", ".env.app", ".env.market-data", ".env.research-data") if name in text]\n                result["has_exec_start"] = bool(re.search(r"(?m)^ExecStart=", text))\n        if overlay:\n            values, invalid, unexpected, duplicates = {}, 0, 0, 0\n            allowed = RESEARCH_ASSIGNMENTS if path.name == "research-data.env" else MARKET_ASSIGNMENTS\n            for line in text.splitlines():\n                line = line.strip()\n                if not line or line.startswith("#"):\n                    continue\n                match = re.fullmatch(r"(?:export\\s+)?([A-Z_][A-Z0-9_]*)=(.*)", line)\n                if not match:\n                    invalid += 1\n                    continue\n                try:\n                    lexer = shlex.shlex(match[2], posix=True, punctuation_chars=";&|<>")\n                    lexer.whitespace_split = True\n                    tokens = list(lexer)\n                    if (len(tokens) > 1 or "$" in match[2] or "`" in match[2]\n                            or any(ord(char) < 32 or ord(char) == 127 for char in match[2])\n                            or (tokens and tokens[0] and all(char in ";&|<>" for char in tokens[0]))):\n                        raise ValueError()\n                    unexpected += match[1] not in allowed\n                    duplicates += match[1] in values\n                    values[match[1]] = tokens[0] if tokens else ""\n                except ValueError:\n                    invalid += 1\n            result.update(safe_settings(values))\n            result["literal_parse_valid"] = invalid == 0 and duplicates == 0 and unexpected == 0\n            result["invalid_assignment_count"] = invalid\n            result["unexpected_assignment_count"] = unexpected\n            result["duplicate_assignment_count"] = duplicates\n        return result\n    except FileNotFoundError:\n        return result\n    except Exception:\n        result["status"] = "metadata_or_safe_read_failed"\n        return result\n    finally:\n        if fd is not None:\n            os.close(fd)\n\n\nclass InventoryRepository:\n    """Aggregate-only queries, using the existing common DB connection layer."""\n    @staticmethod\n    def job_summary(connection):\n        cursor = connection.cursor()\n        try:\n            cursor.execute("START TRANSACTION READ ONLY")\n            cursor.execute("""SELECT CASE WHEN kind IN (\'research\',\'chat\',\'review\') THEN kind ELSE \'other\' END AS run_kind,\n                status, COUNT(*) AS n,\n                MIN(TIMESTAMPDIFF(SECOND, heartbeat_at, UTC_TIMESTAMP())) AS newest_heartbeat_age_seconds,\n                MAX(TIMESTAMPDIFF(SECOND, heartbeat_at, UTC_TIMESTAMP())) AS oldest_heartbeat_age_seconds,\n                SUM(heartbeat_at IS NULL) AS missing_heartbeats\n                FROM app_agent_runs WHERE status IN (\'queued\',\'running\',\'paused\')\n                GROUP BY run_kind, status LIMIT 16""")\n            groups = [{key: row[key] if key in {"run_kind", "status"} else (int(row[key]) if row[key] is not None else None)\n                       for key in ("run_kind", "status", "n", "newest_heartbeat_age_seconds", "oldest_heartbeat_age_seconds", "missing_heartbeats")}\n                      for row in cursor.fetchall()]\n            cursor.execute("SELECT TIMESTAMPDIFF(SECOND, MAX(finished_at), UTC_TIMESTAMP()) AS seconds_since_latest_finished FROM app_agent_runs")\n            latest = cursor.fetchone()["seconds_since_latest_finished"]\n            return {"status": "available", "transaction": "read_only", "active_groups": groups,\n                    "queued": sum(row["n"] for row in groups if row["status"] == "queued"),\n                    "running": sum(row["n"] for row in groups if row["status"] == "running"),\n                    "paused": sum(row["n"] for row in groups if row["status"] == "paused"),\n                    "seconds_since_latest_finished": int(latest) if latest is not None else None}\n        finally:\n            connection.rollback()\n            cursor.close()\n\n\ndef inventory():\n    properties = ("MainPID,ActiveState,SubState,FragmentPath,DropInPaths,ExecStart,EnvironmentFiles,"\n                  "MemoryMax,MemoryHigh,MemorySwapMax,MemoryCurrent,Nice,TimeoutStartUSec,TimeoutStopUSec,Restart,RestartUSec,KillMode,KillSignal")\n    response = subprocess.run(["systemctl", "show", SERVICE, "--property=" + properties],\n                              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=15, check=True)\n    props = dict(line.split("=", 1) for line in response.stdout.splitlines() if "=" in line)\n    result = {"mode": "activation_inventory", "read_only": True, "provider_calls": 0, "model_calls": 0,\n              "checked_at_utc": datetime.now(timezone.utc).isoformat(), "service": SERVICE}\n    pid = int(props.get("MainPID", "0"))\n    result["main_pid"] = pid\n    if pid <= 0:\n        result["status"] = "no_running_worker"\n        return result\n    process = Path("/proc") / str(pid)\n    env = dict(item.decode("utf-8", "replace").split("=", 1) for item in (process / "environ").read_bytes().split(b"\\0") if b"=" in item)\n    argv = [item.decode("utf-8", "replace") for item in (process / "cmdline").read_bytes().split(b"\\0") if item]\n    cwd_ok = (process / "cwd").resolve() == ROOT\n    interpreter = argv[0] if argv and re.fullmatch(r"/opt/kalshi/\\.venv(?:313)?/bin/python(?:3(?:\\.\\d{1,2})?)?", argv[0]) else None\n    result.update(safe_settings(env))\n    result.update(cwd=str(ROOT) if cwd_ok else "[unexpected]", interpreter=interpreter or "[unexpected]",\n                  worker_module_argv=any(argv[index:index + 3] == ["-m", "app.worker", "agents"] for index in range(len(argv))))\n    result["exec_start"] = classify_exec_start(props.get("ExecStart", ""), interpreter)\n    result["environment_file_mentions"] = [name for name in (".env.aws", ".env.app", ".env.market-data", ".env.research-data") if name in props.get("EnvironmentFiles", "")]\n    result["service_settings"] = {key: value if re.fullmatch(r"[a-z0-9 -]{1,64}", value) else "[invalid_or_redacted]"\n                                  for key, value in props.items() if key in {"ActiveState", "SubState", "MemoryMax", "MemoryHigh", "MemorySwapMax", "MemoryCurrent", "Nice", "TimeoutStartUSec", "TimeoutStopUSec", "Restart", "RestartUSec", "KillMode", "KillSignal"}}\n    sensitive = _secret_values(env)\n    paths = [("fragment", props.get("FragmentPath", ""))]\n    paths += [("drop_in_" + str(index), value) for index, value in enumerate(shlex.split(props.get("DropInPaths", ""))) ]\n    result["drop_in_count"] = len(paths) - 1\n    result["installed_unit_files"] = {}\n    for label, value in paths[:33]:\n        allowed = re.fullmatch(r"/(?:etc|run|usr/lib|lib)/systemd/system/recursive-agents\\.service(?:\\.d/[^/\\x00-\\x1f]+\\.conf)?", value)\n        result["installed_unit_files"][label] = _file(Path(value), hashed=True, secrets=sensitive) if allowed else {"status": "path_withheld_or_unrecognized"}\n    result["provider_directory"] = _directory(CONFIG_ROOT)\n    result["protected_overlays"] = {name: _file(CONFIG_ROOT / name, overlay=True) for name in ("market-data.env", "research-data.env")}\n    result["staged_provider_dropin"] = _file(PROVIDER_DROP, hashed=True, secrets=sensitive)\n    result["staged_startup"] = _staged_startup(props.get("FragmentPath", ""), interpreter or "")\n    result["no_unrecognized_pending_dropins"] = _no_unrecognized_pending_dropins()\n    result["app_source_files"] = {name: _file(ROOT / name, hashed=True, secrets=sensitive) for name in SOURCE_FILES}\n    result["database_jobs"] = {"status": "not_checked_unexpected_process_layout"}\n    if cwd_ok and interpreter and result["worker_module_argv"]:\n        old_env, old_path, old_bytecode = dict(os.environ), list(sys.path), sys.dont_write_bytecode\n        old_logging, connection = logging.root.manager.disable, None\n        try:\n            os.environ.clear()\n            os.environ.update(env)\n            sys.path.insert(0, str(ROOT))\n            sys.dont_write_bytecode = True\n            logging.disable(logging.CRITICAL)\n            with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):\n                from data_pipeline.common import get_db_conn\n                connection = get_db_conn()\n                result["database_jobs"] = InventoryRepository.job_summary(connection)\n        except Exception:\n            result["database_jobs"] = {"status": "read_only_query_failed"}\n        finally:\n            if connection is not None:\n                connection.close()\n            os.environ.clear()\n            os.environ.update(old_env)\n            sys.path[:] = old_path\n            sys.dont_write_bytecode = old_bytecode\n            logging.disable(old_logging)\n    serialized = json.dumps(result)\n    if any(secret in serialized for secret in sensitive):\n        raise RuntimeError("InventoryRedactionCheckFailed")\n    result["status"] = "inspected"\n    return result\n\n\ndef run_checks(credentials=None):\n    """Compatibility with the encrypted runner; injected credentials are ignored."""\n    return inventory()\n'
          HELPER_SOURCE = '"""Validate market-data settings and optionally install a separate private env file.\n\nNo provider requests, shell evaluation, service restart or deployment is performed.\nEffective defaults are overlaid by recognized process variables, then by file\nassignments (including blanks). Only literal, single-line assignments are accepted.\n"""\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport shlex\nimport stat\nimport sys\nimport tempfile\nfrom typing import Mapping\n\nENV_KEYS = (\n    "TAU_MARKET_DATA_PRIMARY", "TAU_DATABENTO_DEFAULT_DATASET",\n    "TAU_DATABENTO_ENABLED", "DATABENTO_API_KEY", "TAU_DATABENTO_DATASETS",\n    "TAU_DATABENTO_MAX_COST_USD", "TAU_ALPACA_ENABLED", "APCA_API_KEY_ID",\n    "APCA_API_SECRET_KEY", "TAU_ALPACA_FEED", "TAU_ALPACA_SYMBOLS",\n    "ALPACA_DATA_ENDPOINT", "TAU_MASSIVE_ENABLED", "MASSIVE_API_KEY",\n    "TAU_MASSIVE_FX_FEED", "TAU_MASSIVE_FX_SYMBOLS", "TAU_MASSIVE_DATASETS",\n)\nASSIGNMENT = re.compile(r"(?:export[ \\t]+)?([A-Z_][A-Z0-9_]*)=(.*)")\nMAX_FILE_BYTES = 64 * 1024\n\n\nclass ConfigurationFileError(ValueError):\n    """A safe operator-facing error that never contains a setting\'s value."""\n\n\ndef _configuration_module():\n    # Direct script execution starts with scripts/ on sys.path, not the product root.\n    product_root = str(Path(__file__).resolve().parents[1])\n    if product_root not in sys.path:\n        sys.path.insert(0, product_root)\n    from app import market_data_config\n\n    return market_data_config\n\n\ndef _check_value(value: str) -> None:\n    if any(ord(char) < 32 or ord(char) == 127 for char in value):\n        raise ConfigurationFileError("Settings must be single-line printable literals.")\n    if "$" in value or "`" in value:\n        raise ConfigurationFileError("Shell expansion and command substitution are not accepted.")\n\n\ndef parse_assignments(contents: str) -> dict[str, str]:\n    """Parse literal KEY=VALUE or export KEY=VALUE; reject ambiguous assignments."""\n    result = {}\n    for line_number, line in enumerate(contents.splitlines(), 1):\n        line = line.strip()\n        if not line or line.startswith("#"):\n            continue\n        match = ASSIGNMENT.fullmatch(line)\n        if match is None or match[1] not in ENV_KEYS:\n            raise ConfigurationFileError(f"Unsupported assignment at line {line_number}.")\n        key, raw_value = match.groups()\n        if key in result:\n            raise ConfigurationFileError(f"Duplicate assignment at line {line_number}.")\n        try:\n            lexer = shlex.shlex(raw_value, posix=True, punctuation_chars=";&|<>")\n            lexer.whitespace_split = True\n            tokens = list(lexer)\n        except ValueError:\n            raise ConfigurationFileError(f"Invalid single-line quoting at line {line_number}.") from None\n        if len(tokens) > 1 or (tokens and tokens[0] and all(char in ";&|<>" for char in tokens[0])):\n            raise ConfigurationFileError(f"Expected one literal value at line {line_number}.")\n        value = tokens[0] if tokens else ""\n        _check_value(value)\n        result[key] = value\n    return result\n\n\ndef _private_regular_file(info: os.stat_result) -> bool:\n    return stat.S_ISREG(info.st_mode) and not (info.st_mode & 0o077)\n\n\ndef read_private_file(path: Path) -> dict[str, str]:\n    """Open without following the final symlink, then validate the open file."""\n    descriptor = None\n    try:\n        descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)\n        if not _private_regular_file(os.fstat(descriptor)):\n            raise ConfigurationFileError("Input must be a private regular file without group/other permissions.")\n        with os.fdopen(descriptor, "r", encoding="utf-8") as stream:\n            descriptor = None\n            contents = stream.read(MAX_FILE_BYTES + 1)\n        if len(contents.encode("utf-8")) > MAX_FILE_BYTES:\n            raise ConfigurationFileError("Configuration file exceeds the supported size.")\n        return parse_assignments(contents)\n    except (OSError, UnicodeError):\n        raise ConfigurationFileError("Cannot safely read the private configuration file.") from None\n    finally:\n        if descriptor is not None:\n            os.close(descriptor)\n\n\ndef configuration_environment(env: Mapping[str, str], path: Path | None = None) -> dict[str, str]:\n    """A supplied file overrides recognized process values, including empty strings."""\n    result = dict(_configuration_module().ENV_DEFAULTS)\n    result.update({key: env[key] for key in ENV_KEYS if key in env})\n    if path is not None:\n        result.update(read_private_file(path))\n    for value in result.values():\n        _check_value(value)\n    return result\n\n\ndef _check_output(path: Path) -> os.stat_result | None:\n    try:\n        info = path.lstat()\n    except FileNotFoundError:\n        return None\n    if not _private_regular_file(info):\n        raise ConfigurationFileError("Existing output must be a private regular file, never a symlink.")\n    return info\n\n\ndef install_environment(path: Path, env: Mapping[str, str], input_path: Path | None = None) -> None:\n    """Atomically replace a private target; never source the generated shell file."""\n    temp_path = None\n    try:\n        if path.name in {".env", ".env.app", ".env.aws"}:\n            raise ConfigurationFileError("Output must be a separate market-data overlay, not a base environment file.")\n        parent_info = path.parent.lstat()\n        if not stat.S_ISDIR(parent_info.st_mode) or parent_info.st_mode & 0o022:\n            raise ConfigurationFileError("Output directory must be a real directory without group/other write permission.")\n        before = _check_output(path)\n        if input_path is not None and before is not None and os.path.samestat(input_path.stat(), before):\n            raise ConfigurationFileError("Output must be separate from the input file.")\n        descriptor, temporary = tempfile.mkstemp(prefix=".market-data-", dir=path.parent)\n        temp_path = Path(temporary)\n        with os.fdopen(descriptor, "w", encoding="utf-8", newline="\\n") as stream:\n            os.fchmod(stream.fileno(), 0o600)\n            stream.write("# Installed by configure_market_data.py; private market-data settings only.\\n")\n            for key in ENV_KEYS:\n                stream.write(f"export {key}={shlex.quote(env[key])}\\n")\n            stream.flush()\n            os.fsync(stream.fileno())\n        current = _check_output(path)\n        if (before is None) != (current is None) or (before is not None and not os.path.samestat(before, current)):\n            raise ConfigurationFileError("Output changed during installation; retry after checking the target.")\n        os.replace(temp_path, path)\n        temp_path = None\n    except OSError:\n        raise ConfigurationFileError("Cannot safely install the private configuration file.") from None\n    finally:\n        if temp_path is not None:\n            temp_path.unlink(missing_ok=True)\n\n\ndef _invalid_report(message: str) -> dict:\n    return {"ready": False, "status": "invalid", "applied": False,\n            "errors": [{"field": "configuration_file", "code": "invalid_configuration", "message": message}],\n            "provider_validation": "not_performed", "network_requests": 0}\n\n\ndef main(argv: list[str] | None = None) -> int:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument("--env-file", type=Path, help="Private literal settings; overrides process variables, including blanks.")\n    parser.add_argument("--output", type=Path, help="Separate protected env target; only written with --apply.")\n    parser.add_argument("--apply", action="store_true", help="Install a ready configuration. Never restarts services.")\n    args = parser.parse_args(argv)\n    try:\n        if args.apply and args.output is None:\n            raise ConfigurationFileError("--apply requires an explicit --output path.")\n        env = configuration_environment(os.environ, args.env_file)\n        report = _configuration_module().check_configuration(env)\n        report["applied"] = False\n        if args.apply and report["ready"]:\n            install_environment(args.output, env, args.env_file)\n            report["applied"] = True\n    except ConfigurationFileError as exc:\n        report = _invalid_report(str(exc))\n    print(json.dumps(report, indent=2, allow_nan=False))\n    return 0 if report["ready"] else 2\n\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n'
          VERIFICATION_SOURCE = '"""Bounded real-provider/tool-protocol probes; never invoke the model or actions."""\nimport contextlib\nfrom datetime import datetime, timezone\nfrom decimal import Decimal\nimport io\nimport json\nimport logging\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport time\n\nROOT = Path(\'/opt/kalshi\')\nWINDOW_START = datetime(2026, 10, 16, 14, 0, tzinfo=timezone.utc)\nWINDOW_END = datetime(2026, 10, 16, 14, 10, tzinfo=timezone.utc)\n# Verification must use the actual worker environment, with no injected keys or flags.\nPROVIDER_FIELDS = (\'APCA_API_KEY_ID\', \'APCA_API_SECRET_KEY\', \'MASSIVE_API_KEY\', \'DATABENTO_API_KEY\', \'EXA_API_KEY\')\nSETTING_NAMES = (\'TAU_MARKET_DATA_PRIMARY\',\'TAU_DATABENTO_ENABLED\',\'TAU_DATABENTO_DEFAULT_DATASET\',\n                 \'TAU_DATABENTO_DATASETS\',\'TAU_DATABENTO_MAX_COST_USD\',\'TAU_ALPACA_ENABLED\',\'TAU_ALPACA_FEED\',\n                 \'TAU_ALPACA_SYMBOLS\',\'TAU_MASSIVE_ENABLED\',\'TAU_MASSIVE_FX_FEED\',\'TAU_MASSIVE_FX_SYMBOLS\',\n                 \'TAU_MASSIVE_DATASETS\',\'TAU_EXA_ENABLED\',\'TAU_EXA_HISTORICAL_ENABLED\')\n\n\ndef summarize(packet):\n    """Keep counts/provenance, never prices, article excerpts or raw API bodies."""\n    result = {k: packet[k] for k in (\n        \'provider\', \'kind\', \'status\', \'code\', \'feed\', \'dataset\', \'timeframe\',\n        \'retrieved_at\', \'start\', \'end_exclusive\', \'requested_start\',\n        \'requested_end_exclusive\', \'availability_clipped\', \'complete\',\n        \'estimated_cost_usd\', \'reserved_cost_usd\', \'budget_limit_usd\',\n        \'download_started\', \'cache_hit\', \'observation_count\', \'last_observation_date\',\n        \'snapshot_as_of\', \'temporal_basis\', \'reported_cost_usd\', \'request_id\',\n        \'excluded_after_cutoff\', \'historical_ranking\', \'qualified_backtest_features\',\n        \'scripted_model_calls\', \'real_model_calls\', \'knowledge_receipt_count\',\n        \'historical\', \'historical_current_data_blocked\', \'secret_in_model_context\',\n    ) if k in packet}\n    if isinstance(packet.get(\'sources\'), list):\n        sources = packet[\'sources\']\n        result.update(source_count=len(sources),\n                      source_hosts=sorted({s.get(\'publisher_host\') for s in sources if s.get(\'publisher_host\')}),\n                      sources_with_excerpts=sum(bool(s.get(\'excerpt\')) for s in sources),\n                      source_hashes=[s.get(\'content_sha256\') for s in sources[:3]])\n    if isinstance(packet.get(\'bars\'), dict):\n        result[\'bar_counts\'] = {s: len(rows) for s, rows in packet[\'bars\'].items()}\n        result[\'completed_intervals_only\'] = all(\n            row.get(\'interval_end\', \'\') <= packet.get(\'end_exclusive\', \'\')\n            for rows in packet[\'bars\'].values() for row in rows)\n    if isinstance(packet.get(\'symbols\'), dict):\n        result[\'symbols\'] = {s: {k: row[k] for k in (\'status\', \'count\', \'bar_count\',\n                             \'first_timestamp\', \'last_timestamp\', \'last_interval_end\', \'first_bar\', \'last_completed_at\') if k in row}\n                             for s, row in packet[\'symbols\'].items()}\n    if isinstance(packet.get(\'snapshots\'), dict):\n        result[\'snapshots\'] = {}\n        for symbol, snap in packet[\'snapshots\'].items():\n            item = {k: snap[k] for k in (\'status\', \'stale\', \'usable\', \'reason\') if k in snap}\n            for name in (\'latest_trade\', \'latest_quote\'):\n                if isinstance(snap.get(name), dict):\n                    item[name] = {k: snap[name][k] for k in (\'timestamp\', \'fresh\', \'stale\', \'age_seconds\', \'usable\') if k in snap[name]}\n            result[\'snapshots\'][symbol] = item\n        if packet.get(\'asset_class\') == \'us_option\':\n            contracts = list(packet[\'snapshots\'].values())\n            result.update(option_contract_count=len(contracts),\n                          contracts_with_iv=sum(c.get(\'implied_volatility\') is not None for c in contracts),\n                          contracts_with_greeks=sum(bool(c.get(\'greeks\')) for c in contracts))\n    if isinstance(packet.get(\'contracts\'), list):\n        result.update(contract_count=len(packet[\'contracts\']),\n                      contracts_with_iv=sum(c.get(\'implied_volatility\') is not None for c in packet[\'contracts\']),\n                      contracts_with_greeks=sum(bool(c.get(\'greeks\')) for c in packet[\'contracts\']))\n    if isinstance(packet.get(\'observations\'), list):\n        rows = packet[\'observations\']\n        result.update(observation_count=len(rows), last_observation_date=rows[-1].get(\'date\') if rows else None,\n                      observation_fields=sorted({k for row in rows for k in row if k != \'date\'}))\n    if isinstance(packet.get(\'latest_values\'), dict):\n        result[\'latest_field_dates\'] = {k: v.get(\'observation_date\') for k, v in packet[\'latest_values\'].items()}\n    return result\n\n\ndef actual_worker_environment():\n    pid = int(subprocess.check_output([\'systemctl\', \'show\', \'recursive-agents\', \'--property=MainPID\', \'--value\'], text=True).strip())\n    if pid <= 0:\n        raise RuntimeError(\'NoRunningWorker\')\n    proc = Path(\'/proc\') / str(pid)\n    env = dict(item.decode(\'utf-8\', \'replace\').split(\'=\', 1)\n               for item in (proc / \'environ\').read_bytes().split(b\'\\0\') if b\'=\' in item)\n    if (proc / \'cwd\').resolve() != ROOT:\n        raise RuntimeError(\'UnexpectedWorkerDirectory\')\n    return pid, env\n\n\ndef run_checks(credentials=None):\n    pid, original_env = actual_worker_environment()\n    credentials = {name: original_env.get(name, \'\') for name in PROVIDER_FIELDS}\n    if not all(credentials.values()):\n        raise RuntimeError(\'ActualWorkerProviderCredentialsMissing\')\n    os.environ.clear()\n    os.environ.update(original_env)\n    os.chdir(ROOT)\n    sys.path.insert(0, str(ROOT))\n    logging.disable(logging.CRITICAL)\n    from app.alpaca_data import AlpacaDataClient, Config as AlpacaConfig\n    from app.massive_data import MassiveDataClient, Config as MassiveConfig\n    from app.databento_data import DatabentoDataClient, Config as DatabentoConfig, CostBudget\n    from app.agent_market_data import AgentMarketData, DataScope, _freshness\n    from app.agent_knowledge import AgentKnowledge\n    from app.llm import Usage\n    from app import agent_market_data as market_module\n\n    # Diagnostic pacing only; no product quota or service setting changes.\n    last_massive_request = [0.0]\n    def pace_massive():\n        remaining = 13 - (time.monotonic() - last_massive_request[0])\n        if remaining > 0:\n            time.sleep(remaining)\n        last_massive_request[0] = time.monotonic()\n    original_massive_client = MassiveDataClient\n    def paced_massive_client(config, **kwargs):\n        callback = kwargs.pop(\'checkpoint\', lambda: None)\n        def combined():\n            callback()\n            pace_massive()\n        return original_massive_client(config, checkpoint=combined, **kwargs)\n    market_module.MassiveDataClient = paced_massive_client\n\n    output = {\'mode\': \'production_provider_verification\', \'source_host\': \'production_web_box\',\n              \'worker_pid_for_environment\': pid, \'production_worker_modified\': False,\n              \'credentials_source\': \'actual_worker_proc_environment\', \'model_backend\': \'scripted_no_llm\',\n              \'database_or_order_actions\': False, \'actual_worker_settings\': {name: original_env.get(name) for name in SETTING_NAMES},\n              \'diagnostic_massive_request_spacing_seconds\': 13,\n              \'checked_at_utc\': datetime.now(timezone.utc).isoformat(), \'checks\': [], \'events\': []}\n    from app.market_data_config import check_configuration\n    output[\'actual_worker_preflight\'] = check_configuration(original_env)\n    if not output[\'actual_worker_preflight\'][\'ready\']:\n        raise RuntimeError(\'ActualWorkerProviderConfigurationInvalid\')\n    if original_env.get(\'TAU_EXA_ENABLED\') != \'1\' or original_env.get(\'TAU_EXA_HISTORICAL_ENABLED\') != \'1\':\n        raise RuntimeError(\'ActualWorkerExaActivationMissing\')\n    active_bridge = [None]\n    def error_result(exc):\n        return {\'status\': \'unavailable\', \'code\': getattr(exc, \'code\', type(exc).__name__),\n                \'error_class\': type(exc).__name__}\n    def check(name, operation):\n        started = time.monotonic()\n        try:\n            # Suppress library stdout/stderr; only the summary leaves this process.\n            with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):\n                packet = operation()\n            receipt = summarize(packet)\n            empty = ((\'bar_counts\' in receipt and not any(receipt[\'bar_counts\'].values()))\n                     or (\'observation_count\' in receipt and receipt[\'observation_count\'] == 0)\n                     or (\'source_count\' in receipt and receipt[\'source_count\'] == 0)\n                     or (\'option_contract_count\' in receipt and receipt[\'option_contract_count\'] == 0))\n            receipt.setdefault(\'status\', \'missing\' if empty else \'available\')\n        except Exception as exc:\n            packet, receipt = None, error_result(exc)\n        output[\'checks\'].append({\'name\': name, \'elapsed_seconds\': round(time.monotonic()-started, 3), **receipt})\n        return packet\n    def event(kind, message, packet=None):\n        if isinstance(packet, dict):\n            packet = packet.get(\'market_data\', packet)\n            if isinstance(packet, dict):\n                output[\'events\'].append({\'event_kind\': kind, \'bridge\': active_bridge[0], **summarize(packet)})\n\n    # Small fixed Friday windows avoid conflating closed-market freshness with auth.\n    with AlpacaDataClient(AlpacaConfig.from_env()) as client:\n        check(\'alpaca_current_snapshot\', lambda: _freshness({\'status\': \'available\', **client.snapshots([\'SPY\'])}, datetime.now(timezone.utc)))\n        check(\'alpaca_completed_history\', lambda: client.bars([\'SPY\'], WINDOW_START, WINDOW_END, timeframe=\'1Min\'))\n    with paced_massive_client(MassiveConfig.from_env()) as client:\n        check(\'massive_fx_history\', lambda: client.fx_bars([\'EURUSD\'], WINDOW_START, WINDOW_END, timeframe=\'1Min\'))\n        for dataset in (\'treasury_yields\', \'funding_conditions\'):\n            check(\'massive_\' + dataset, lambda dataset=dataset: client.macro(dataset,\n                  datetime(2026, 10, 1, tzinfo=timezone.utc), datetime(2026, 10, 17, tzinfo=timezone.utc)))\n    output[\'checks\'].extend([\n        {\'name\': \'massive_options_chain\', \'status\': \'disabled_configuration\', \'reason\': \'prior_live_entitlement_denial\'},\n        {\'name\': \'massive_current_fx\', \'status\': \'disabled_configuration\', \'reason\': \'prior_live_entitlement_denial\'},\n    ])\n    config = DatabentoConfig.from_env()\n    with DatabentoDataClient(config, budget=CostBudget(config.max_cost_usd)) as client:\n        for dataset, symbol in ((\'EQUS.MINI\', \'SPY\'), (\'GLBX.MDP3\', \'ESZ6\')):\n            check(\'databento_estimate_\' + dataset, lambda dataset=dataset, symbol=symbol:\n                  client.estimate([symbol], dataset, WINDOW_START, WINDOW_END, timeframe=\'1Min\'))\n            check(\'databento_bars_\' + dataset, lambda dataset=dataset, symbol=symbol:\n                  client.bars([symbol], dataset, WINDOW_START, WINDOW_END, timeframe=\'1Min\'))\n\n    def bridge(name, historical):\n        active_bridge[0] = name\n        scope = DataScope.research(int(WINDOW_START.timestamp()), int(WINDOW_END.timestamp())) if historical else DataScope()\n        usage, stage = Usage(), {\'index\': 0, \'calls\': 0, \'secret_leak\': False}\n        knowledge = AgentKnowledge(scope, event)\n        market = AgentMarketData(scope, event)\n        def model(system, messages):\n            stage[\'calls\'] += 1\n            text = system + json.dumps(messages)\n            stage[\'secret_leak\'] |= any(v and v in text for v in credentials.values())\n            index = stage[\'index\']\n            stage[\'index\'] += 1\n            if index == 0:\n                requests = [{\'kind\': \'publications\' if historical else \'search\',\n                             \'query\': \'prediction market probability calibration research\' if historical else \'Federal Reserve monetary policy October 2026\'}]\n                if not historical:\n                    requests.append({\'kind\': \'publications\', \'query\': \'prediction market probability calibration research\'})\n                obj = {\'knowledge_requests\': requests}\n            elif index == 1:\n                sources = [s for p in knowledge.receipts for s in p.get(\'sources\', [])]\n                if sources:\n                    obj = {\'knowledge_requests\': [{\'kind\': \'contents\', \'source_id\': sources[0][\'source_id\']}]}\n                else:\n                    # Provider denial must not prevent testing the market bridge.\n                    stage[\'index\'] = 3\n                    return model_market_request(2), {\'input_tokens\': 0, \'output_tokens\': 0}\n            elif index == 2:\n                return model_market_request(index), {\'input_tokens\': 0, \'output_tokens\': 0}\n            elif index == 3 and historical:\n                return model_market_request(index), {\'input_tokens\': 0, \'output_tokens\': 0}\n            else:\n                obj = {\'reply\': \'Provider smoke test complete.\', \'actions\': []}\n            return json.dumps(obj), {\'input_tokens\': 0, \'output_tokens\': 0}\n        def model_market_request(index):\n            if index == 3:\n                requests = [\n                    {\'provider\': \'databento\', \'kind\': \'bars\', \'dataset\': \'EQUS.MINI\', \'symbols\': [\'SPY\'], \'timeframe\': \'1Min\', \'lookback_days\': 1},\n                    {\'provider\': \'databento\', \'kind\': \'bars\', \'dataset\': \'GLBX.MDP3\', \'symbols\': [\'ESZ6\'], \'timeframe\': \'1Min\', \'lookback_days\': 1},\n                ]\n            elif historical:\n                requests = [\n                    {\'provider\': \'alpaca\', \'kind\': \'bars\', \'symbols\': [\'SPY\'], \'timeframe\': \'1Min\', \'lookback_days\': 1},\n                    {\'provider\': \'massive\', \'kind\': \'fx_bars\', \'symbols\': [\'EURUSD\'], \'timeframe\': \'1Min\', \'lookback_days\': 1},\n                ]\n            else:\n                requests = [\n                    {\'provider\': \'alpaca\', \'kind\': \'snapshots\', \'symbols\': [\'SPY\']},\n                    {\'provider\': \'massive\', \'kind\': \'fx_bars\', \'symbols\': [\'EURUSD\'], \'timeframe\': \'1Hour\', \'lookback_days\': 7},\n                ]\n            return json.dumps({\'market_data_requests\': requests})\n        result = market.ask(knowledge.wrap(model, usage), \'Read-only diagnostic. Return no actions.\',\n                            [{\'role\': \'user\', \'content\': \'Verify provider tool receipts.\'}], lambda obj: obj, usage)\n        if result.get(\'actions\') != []:\n            raise RuntimeError(\'UnexpectedActionPayload\')\n        if stage[\'secret_leak\']:\n            raise RuntimeError(\'SecretInModelContext\')\n        receipt = {\'provider\': \'agent_tool_bridge\', \'status\': \'protocol_completed\', \'kind\': name,\n                   \'scripted_model_calls\': stage[\'calls\'], \'real_model_calls\': 0,\n                   \'knowledge_receipt_count\': len(knowledge.receipts),\n                   \'secret_in_model_context\': stage[\'secret_leak\'],\n                   \'historical\': historical, \'snapshot_as_of\': scope.cutoff.isoformat() if historical else None}\n        if historical:\n            guards = [market._rea