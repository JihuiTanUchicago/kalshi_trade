name: Isolated Alpaca paper acceptance

# Operations-only branch: dispatches a disposable test app, never an AWS deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tau-paper-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paper-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: python:3.12-bookworm
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tau_paper_staging
          MYSQL_USER: tau_stage
          MYSQL_PASSWORD: disposable-fixture-only
          MYSQL_ROOT_PASSWORD: disposable-root-fixture-only
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_USER: tau_stage
      MYSQL_PASSWORD: disposable-fixture-only
      MYSQL_DATABASE: tau_paper_staging
      TAU_STAGING_DISPOSABLE_DB: '1'
      TAU_DISABLE_CATALOG_MARKETS: '1'
      APP_HOST: 127.0.0.1
      APP_PORT: '8091'
      APP_DEV_LOGIN: '1'
      APP_LIVE_TRADING_ENABLED: '0'
      APP_NO_SIDE_LIVE_ENABLED: '0'
      APP_INSECURE_COOKIES: '1'
      APP_PUBLIC_URL: http://127.0.0.1:8091
      TAU_ALPACA_PAPER_ENABLED: '1'
      TAU_ALPACA_PAPER_MAX_ORDER_USD: '500'
      TAU_ALPACA_ENABLED: '0'
      TAU_MASSIVE_ENABLED: '0'
      TAU_DATABENTO_ENABLED: '0'
      TAU_EXA_ENABLED: '0'
      TAU_EXA_HISTORICAL_ENABLED: '0'
      TAU_WORLDMONITOR_ENABLED: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact isolated-test revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node for frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: pip install -r kalshi_trade_infra/requirements.txt
      - name: Create a fresh disposable encryption key
        run: |
          python - <<'PY'
          import os
          from cryptography.fernet import Fernet
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('APP_SECRET_KEY=' + Fernet.generate_key().decode() + '\n')
          PY
      - name: Validate staging isolation guards
        working-directory: kalshi_trade_infra
        run: |
          python -m pytest tests/test_paper_staging_smoke.py -q
          python -m py_compile app/*.py data_pipeline/*.py scripts/paper_staging_smoke.py
      - name: Apply the full schema only to the disposable database
        working-directory: kalshi_trade_infra
        run: python -m app.schema
      - name: Exercise actual HTTP and MySQL with a synthetic broker
        working-directory: kalshi_trade_infra
        run: python -B scripts/paper_staging_smoke.py
