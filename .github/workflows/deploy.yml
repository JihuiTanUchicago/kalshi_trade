name: Current-main production preflight only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 6
    steps:
      - name: Check out the exact reviewed preflight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Check pinned main and entire runtime manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/JihuiTanUchicago/kalshi_trade/git/ref/heads/main --jq .object.sha)" = "1bf2b13e8d8b277dcc6ddf4bd0a71123c18ab65c"
          python3 kalshi_trade_infra/results/main_production_preflight_2026-10-19/validate_release.py
      - name: Configure existing deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Read source and runtime readiness without changing application or services
        run: python3 kalshi_trade_infra/results/main_production_preflight_2026-10-19/readiness_runner.py
