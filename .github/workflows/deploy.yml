name: Inspect hosted staging readiness

# Operations-only branch: control-plane reads, no deployment or SSM invocation.
# Never merge this deploy.yml override into main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tau-hosted-staging-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact operations source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure existing AWS credentials for read-only discovery
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Project credential-free readiness receipt
        run: python3 kalshi_trade_infra/staging/hosted_inventory.py
      - name: Save projected receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-staging-inventory
          path: hosted-staging-inventory.json
          if-no-files-found: ignore
          retention-days: 14
