name: Guarded Alpaca paper production rollout

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Read-only inspection or approved idle-only paper release
        required: true
        type: choice
        options: [inspect, activate]
        default: inspect

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    env:
      TAU_PAPER_RELEASE_STATE: /tmp/tau-paper-release-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Check out the immutable reviewed operations revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Inspect or perform the approved guarded rollout
        env:
          TAU_PAPER_PHASE: ${{ inputs.phase }}
          ALPACA_OAUTH_CLIENT_ID: ${{ secrets.ALPACA_OAUTH_CLIENT_ID }}
          ALPACA_OAUTH_CLIENT_SECRET: ${{ secrets.ALPACA_OAUTH_CLIENT_SECRET }}
        run: python3 kalshi_trade_infra/results/alpaca_paper_operations_2026-10-18/paper_release_runner.py "$TAU_PAPER_PHASE"
      - name: Remove any ephemeral OAuth receiver
        if: ${{ always() }}
        run: python3 kalshi_trade_infra/results/alpaca_paper_operations_2026-10-18/paper_release_runner.py --cleanup
