name: Encrypted read-only selected-source review

on:
  workflow_dispatch:

# Separate from deploy-web: this cannot replace or cancel a pending release.
concurrency:
  group: kalshi-perps-selected-source-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure the existing bounded AWS transport
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Capture only the pinned sources as encrypted bounded pages
        run: python3 -B kalshi_trade_infra/results/kalshi_perps_deployment_preparation_2026-10-23/source_review/runner.py
