name: CI

# Quality gate on every push to main and every pull request: run the test suite and
# byte-compile the Python + JS so a broken import or syntax error can't reach main.
# No secrets, no live DB: tests use an in-process FakeCursor (see tests/conftest.py). The money-path
# job below runs the APP_TEST_MYSQL tests against a throwaway MySQL service container.
# Deploys stay in deploy.yml (manual, OIDC); this workflow never touches the box.

on:
  pull_request:
  push:
    branches: [main]

# One run per ref; a new push cancels the stale in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kalshi_trade_infra/requirements.txt

      - name: Install dependencies
        run: pip install -r kalshi_trade_infra/requirements.txt

      - name: Run tests
        working-directory: kalshi_trade_infra
        run: python -m pytest tests/ -q

      - name: Byte-compile Python
        working-directory: kalshi_trade_infra
        run: python -m py_compile app/*.py app/*/*.py app/*/*/*.py data_pipeline/*.py trading_core/*.py trading_core/*/*.py

      - name: Check import boundaries (ARCHITECTURE.md)
        working-directory: kalshi_trade_infra
        run: |
          pip install import-linter==2.15
          lint-imports

      - name: Check both frontend themes
        working-directory: kalshi_trade_infra
        run: |
          # Both bundles and their page files (app-<name>.js, app.meridian-<name>.js).
          for f in app/static/app*.js; do node --check "$f"; done
          node --test tests/*.mjs
          TAU_TEST_THEME=meridian node --test tests/test_production_ui_reconciliation.mjs

  money-path-mysql:
    # Settlement, cash and row-lock tests need a real MySQL; they skip in `test`, so they rotted
    # unnoticed (two failed on main for a day after the $5 default stake and 'closed'+close_reason).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: kalshi_trade
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_TEST_MYSQL: "1"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ci
      MYSQL_DATABASE: kalshi_trade
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kalshi_trade_infra/requirements.txt

      - name: Install dependencies
        run: pip install -r kalshi_trade_infra/requirements.txt

      - name: Run the real-MySQL tests
        working-directory: kalshi_trade_infra
        run: python -m pytest -q tests/test_app_engine_db.py tests/test_engine_loop_parity_db.py tests/test_rsi_scout.py tests/test_rsi_repair.py tests/test_rsi_playbook.py tests/test_rsi_sleep.py tests/test_paper_money_agrees_db.py tests/test_trades_csv.py tests/test_trades_csv_same_bytes_db.py tests/test_modes_never_mix_db.py tests/test_credits_add_up_db.py tests/test_demo_health_db.py tests/test_backtest_check_db.py tests/test_book_figures_agree_db.py tests/test_demo_isolation_db.py tests/test_delete_strategy_guard_db.py tests/test_hot_reads_same_payload_db.py tests/test_book_memo_db.py tests/test_deployment_curves_same_db.py tests/test_email_prefs_db.py tests/test_market_positions_db.py tests/test_client_errors_db.py tests/test_paper_checks_same_db.py tests/test_run_stop_db.py tests/test_billing_statement_db.py tests/test_old_rows_fuzz_db.py tests/test_autoreload_failure_notice_db.py tests/test_research_list_version_db.py tests/test_dash_poll_version_db.py tests/test_bell_db.py tests/test_autopilot_sessions_db.py tests/test_autopilot_status_db.py tests/test_removed_deployments_db.py tests/test_tune_proposal_round_trip_db.py tests/test_strategy_list_db.py tests/test_strategy_verdict_db.py tests/test_strategy_list_verdict_db.py tests/test_run_progress_line_db.py tests/test_community_delete_db.py tests/test_money_trust_audit_db.py tests/test_btc_spot_db.py tests/test_paper_slippage_estimate_db.py
