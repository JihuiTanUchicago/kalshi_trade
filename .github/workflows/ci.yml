name: CI

# Quality gate on every push to main and every pull request: run the test suite and
# byte-compile the Python + JS so a broken import or syntax error can't reach main.
# No secrets, no live DB — tests use an in-process FakeCursor (see tests/conftest.py).
# Deploys stay in deploy.yml (manual, OIDC); this workflow never touches the box.

on:
  pull_request:
  push:
    branches: [main]

# One run per ref; a new push cancels the stale in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kalshi_trade_infra/requirements.txt

      - name: Install dependencies
        run: pip install -r kalshi_trade_infra/requirements.txt

      - name: Run tests
        working-directory: kalshi_trade_infra
        run: python -m pytest tests/ -q

      - name: Byte-compile Python
        working-directory: kalshi_trade_infra
        run: python -m py_compile app/*.py data_pipeline/*.py

      - name: Check both frontend themes
        working-directory: kalshi_trade_infra
        run: |
          node --check app/static/app.js
          node --check app/static/app.meridian.js
          node --test tests/*.mjs
          TAU_TEST_THEME=meridian node --test tests/test_production_ui_reconciliation.mjs
