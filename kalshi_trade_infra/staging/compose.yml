{
  "services": {
    "db": {
      "image": "mysql:8.4",
      "environment": {
        "MYSQL_DATABASE": "tau_paper_staging",
        "MYSQL_USER": "tau_stage",
        "MYSQL_ROOT_PASSWORD_FILE": "/run/secrets/mysql_root_password",
        "MYSQL_PASSWORD_FILE": "/run/secrets/mysql_password"
      },
      "secrets": ["mysql_root_password", "mysql_password"],
      "volumes": ["mysql-data:/var/lib/mysql"],
      "networks": ["isolated"],
      "healthcheck": {
        "test": ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"],
        "interval": "2s",
        "timeout": "5s",
        "retries": 60,
        "start_period": "30s"
      },
      "mem_limit": "768m",
      "cpus": 1.0,
      "pids_limit": 256
    },
    "schema": {
      "build": {"context": "..", "dockerfile": "staging/Dockerfile"},
      "command": ["schema"],
      "environment": {"TAU_STAGING_CONTAINER": "isolated-compose-v1"},
      "secrets": ["mysql_password", "app_secret_key"],
      "networks": ["isolated"],
      "depends_on": {"db": {"condition": "service_healthy"}},
      "read_only": true,
      "tmpfs": ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"],
      "cap_drop": ["ALL"],
      "cap_add": ["DAC_OVERRIDE", "SETUID", "SETGID"],
      "security_opt": ["no-new-privileges:true"],
      "mem_limit": "512m",
      "cpus": 1.0,
      "pids_limit": 128
    },
    "web": {
      "build": {"context": "..", "dockerfile": "staging/Dockerfile"},
      "command": ["web"],
      "environment": {"TAU_STAGING_CONTAINER": "isolated-compose-v1"},
      "secrets": ["mysql_password", "app_secret_key"],
      "networks": ["isolated"],
      "depends_on": {"schema": {"condition": "service_completed_successfully"}},
      "healthcheck": {
        "test": ["CMD", "/usr/local/bin/python", "-I", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=3).close()"],
        "interval": "2s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "10s"
      },
      "read_only": true,
      "tmpfs": ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"],
      "cap_drop": ["ALL"],
      "cap_add": ["DAC_OVERRIDE", "SETUID", "SETGID"],
      "security_opt": ["no-new-privileges:true"],
      "mem_limit": "512m",
      "cpus": 1.0,
      "pids_limit": 128
    },
    "gateway": {
      "image": "nginx:stable-alpine",
      "user": "101:101",
      "entrypoint": ["nginx", "-c", "/etc/nginx/staging.conf", "-g", "daemon off;"],
      "command": [],
      "networks": ["isolated", "preview"],
      "depends_on": {"web": {"condition": "service_healthy"}},
      "ports": ["127.0.0.1:18090:8080"],
      "volumes": ["./preview-nginx.conf:/etc/nginx/staging.conf:ro"],
      "healthcheck": {
        "test": ["CMD", "wget", "--spider", "-q", "-T", "3", "http://127.0.0.1:8080/healthz"],
        "interval": "2s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "5s"
      },
      "read_only": true,
      "tmpfs": ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"],
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "mem_limit": "64m",
      "cpus": 0.25,
      "pids_limit": 32
    },
    "verify": {
      "build": {"context": "..", "dockerfile": "staging/Dockerfile"},
      "command": ["verify"],
      "environment": {"TAU_STAGING_CONTAINER": "isolated-compose-v1"},
      "secrets": ["mysql_password", "app_secret_key"],
      "networks": ["isolated"],
      "depends_on": {"schema": {"condition": "service_completed_successfully"}},
      "read_only": true,
      "tmpfs": ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"],
      "cap_drop": ["ALL"],
      "cap_add": ["DAC_OVERRIDE", "SETUID", "SETGID"],
      "security_opt": ["no-new-privileges:true"],
      "mem_limit": "512m",
      "cpus": 1.0,
      "pids_limit": 128
    }
  },
  "networks": {"isolated": {"internal": true}, "preview": {"driver": "bridge"}},
  "volumes": {"mysql-data": {}},
  "secrets": {
    "mysql_root_password": {"file": "./.state/mysql_root_password"},
    "mysql_password": {"file": "./.state/mysql_password"},
    "app_secret_key": {"file": "./.state/app_secret_key"}
  }
}
