# Unauthenticated local preview only. Never forwards a browser's credentials.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 5s;
    send_timeout 10s;

    # GET alone does not imply read-only: /unsubscribe and OAuth callbacks can
    # change state. Only the application shell, assets and health are proxied.
    map $uri $preview_allowed {
        default 0;
        "/" 1;
        "/healthz" 1;
        ~^/(?:dashboard|research(?:/[0-9]+)?|strategies(?:/[0-9]+)?|deploy|community|billing|admin|system|funds|explore|devlog|settings(?:/(?:account|billing|system|theme))?|signin)$ 1;
        ~^/static/[a-z0-9_.-]+\.(?:css|js|svg|png|ico|woff2)$ 1;
    }

    server {
        listen 8080;
        server_name _;

        if ($request_method !~ ^(?:GET|HEAD)$) {
            return 403;
        }

        location = /api {
            return 401;
        }
        location ^~ /api/ {
            return 401;
        }

        location / {
            if ($preview_allowed = 0) {
                return 404;
            }
            proxy_pass http://web:8090;
            # The app implements GET but no do_HEAD. NGINX suppresses the body
            # for a client's HEAD after fetching the same immutable GET page.
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host web;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_hide_header Set-Cookie;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}
