worker_processes 1;
pid /tmp/nginx.pid;
# Standard HTTP error logs may contain OAuth callback query values. Keep request
# and runtime HTTP error logging disabled; bootstrap/config failures use stderr.
error_log /dev/null crit;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 8m;
    # The application has no do_HEAD; NGINX suppresses downstream HEAD bodies.
    # Every other method remains unchanged, including API POSTs.
    map $request_method $hosted_upstream_method {
        default $request_method;
        HEAD GET;
    }
    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://web:8090;
            proxy_method $hosted_upstream_method;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            # Normal methods, bodies, query strings, cookies, Set-Cookie and
            # X-Recursive are preserved. The application retains its guards.
        }
    }
}
