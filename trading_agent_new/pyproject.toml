[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polygon-quant-agent"
version = "0.1.0"
description = "Evidence-based quantitative research with verified memory and gated paper execution"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
quant-agent = "quant_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

